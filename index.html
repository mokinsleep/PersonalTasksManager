<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23f5c518'/><text x='32' y='46' text-anchor='middle' font-size='38' font-family='system-ui,sans-serif' font-weight='700' fill='%23ffffff'>M</text></svg>">
<title>个人任务管理工具</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="group-styles.css">
</head>
<body>

<!-- ==================== 左侧工具栏 ==================== -->
<aside class="left-sidebar" id="leftSidebar">
  <div class="sidebar-icons">
    <button class="sidebar-icon-btn active" data-tool="timer" title="计时器">⏱️<span class="tooltip">计时器</span></button>
  </div>
  <div class="sidebar-panel-area" id="sidebarPanelArea">
    <!-- 计时器面板 -->
    <div class="sidebar-panel" id="panel-timer">
      <div class="sidebar-panel-title">⏱️ 计时器</div>
      <div class="timer-mode-switch">
        <button class="timer-mode-btn active" data-mode="countdown">倒计时</button>
        <button class="timer-mode-btn" data-mode="stopwatch">正计时</button>
      </div>
      <div class="timer-inputs" id="timerInputs">
        <input type="number" id="timerH" min="0" max="99" value="0" placeholder="时">
        <span>:</span>
        <input type="number" id="timerM" min="0" max="59" value="5" placeholder="分">
        <span>:</span>
        <input type="number" id="timerS" min="0" max="59" value="0" placeholder="秒">
      </div>
      <div class="timer-display" id="timerDisplay">00:05:00</div>
      <div class="timer-controls">
        <button class="timer-ctrl-btn start" id="timerStart">开始</button>
        <button class="timer-ctrl-btn pause" id="timerPause" style="display:none;">暂停</button>
        <button class="timer-ctrl-btn reset" id="timerReset">重置</button>
      </div>
    </div>
  </div>
</aside>

<!-- ==================== HTML 结构 ==================== -->
<header class="header">
  <h1 style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
    📋 任务看板
    <span class="data-dir-indicator" id="dataDirIndicator" title="当前数据存储位置">💾 localStorage</span>
    <button class="btn-data-dir" id="btnDataDir" title="选择文件夹以将数据保存为文件">📁 设置数据目录</button>
    <button class="btn-daily-todo" id="btnDailyTodo">📅 每日待办</button>
  </h1>
  <div class="stats-bar" id="statsBar">
    <div class="stat-item">总任务 <span class="stat-num" id="statTotal">0</span></div>
    <div class="stat-item done">✅ 已完成 <span class="stat-num" id="statDone">0</span></div>
    <div class="stat-item undone">⏳ 未完成 <span class="stat-num" id="statUndone">0</span></div>
  </div>
  <div class="filter-bar" id="filterBar">
    <label>优先级
      <select id="filterPriority">
        <option value="all">全部</option>
        <option value="high">🔴 高</option>
        <option value="medium">🟡 中</option>
        <option value="low">🟢 低</option>
      </select>
    </label>
    <label>标签
      <select id="filterTag"><option value="all">全部</option></select>
    </label>
    <label>截止日期
      <select id="filterDate">
        <option value="all">全部</option>
        <option value="today">今天</option>
        <option value="week">本周</option>
        <option value="month">本月</option>
      </select>
    </label>
    <label>排序
      <select id="sortBy">
        <option value="created">创建时间</option>
        <option value="dueDate">截止日期</option>
        <option value="priority">优先级</option>
      </select>
    </label>
  </div>
  <div class="batch-bar" id="batchBar">
    <span class="batch-count" id="batchCount">已选择 0 项</span>
    <button class="btn-batch-delete" id="btnBatchDelete">删除选中</button>
    <button class="btn-batch-cancel" id="btnBatchCancel">取消选择</button>
  </div>
</header>

<main class="board" id="board">
  <div class="column col-progress" data-status="in-progress" id="colInProgress">
    <div class="column-header">
      <span class="col-title">🔄 进行中 <span class="col-count" id="countInProgress">0</span></span>
      <span style="display:flex;gap:4px;">
        <button class="btn-add-task" data-status="in-progress" title="新增进行中任务">+</button>
        <button class="btn-add-group" data-status="in-progress" title="新增卡片组" style="width:28px;height:28px;font-size:14px;padding:0;border-radius:7px;flex-shrink:0;">📁</button>
      </span>
    </div>
    <div class="card-list" id="listInProgress"></div>
  </div>
  <div class="column col-todo" data-status="todo" id="colTodo">
    <div class="column-header">
      <span class="col-title">📌 待处理 <span class="col-count" id="countTodo">0</span></span>
      <span style="display:flex;gap:4px;">
        <button class="btn-add-task" data-status="todo" title="新增待处理任务">+</button>
        <button class="btn-add-group" data-status="todo" title="新增卡片组" style="width:28px;height:28px;font-size:14px;padding:0;border-radius:7px;flex-shrink:0;">📁</button>
      </span>
    </div>
    <div class="card-list" id="listTodo"></div>
  </div>
  <div class="column col-done" data-status="done" id="colDone">
    <div class="column-header">
      <span class="col-title">✅ 已完成 <span class="col-count" id="countDone">0</span></span>
      <span style="display:flex;gap:4px;">
        <button class="btn-add-task" data-status="done" title="新增已完成任务">+</button>
        <button class="btn-add-group" data-status="done" title="新增卡片组" style="width:28px;height:28px;font-size:14px;padding:0;border-radius:7px;flex-shrink:0;">📁</button>
      </span>
    </div>
    <div class="card-list" id="listDone"></div>
  </div>
</main>

<!-- 每日待办侧边栏 -->
<div class="daily-overlay" id="dailyOverlay"></div>
<aside class="daily-sidebar" id="dailySidebar">
  <div class="daily-sidebar-header">
    <h2>📅 每日待办</h2>
    <button class="daily-sidebar-close" id="dailySidebarClose">✕</button>
  </div>
  <div class="daily-date-bar" id="dailyDateBar">
    <div class="daily-date-label">
      <span id="dailyDateTitle"></span>
      <small id="dailyDateWeekday"></small>
    </div>
    <button class="btn-daily-calendar" id="dailyGoCalendar">📆 查看历史</button>
  </div>
  <div class="daily-body" id="dailyBody">
    <!-- 今日/日期待办视图 -->
    <div id="dailyTodayView">
      <div id="dailyEmptyHint" class="daily-empty">
        <span class="daily-empty-icon">📭</span>
        今天还没有待办<br>点击下方按钮创建
      </div>
      <button class="btn-daily-create" id="dailyCreateBtn" style="display:none;">＋ 创建今日待办</button>
      <ul class="daily-item-list" id="dailyItemList"></ul>
      <button class="btn-daily-add-item" id="dailyAddItemBtn" style="display:none;">＋ 新增待办</button>
      <div id="dailyAddFormContainer"></div>
    </div>
    <!-- 日历视图（默认隐藏） -->
    <div id="dailyCalendarView" style="display:none;">
      <div class="daily-calendar-header">
        <button class="daily-calendar-nav" id="dailyCalendarPrev">◀</button>
        <span class="daily-calendar-month" id="dailyCalendarMonth"></span>
        <button class="daily-calendar-nav" id="dailyCalendarNext">▶</button>
      </div>
      <div class="daily-calendar-grid" id="dailyCalendarGrid"></div>
      <button class="btn-back-today" id="dailyBackToday">← 返回今日</button>
    </div>
  </div>
</aside>

<div class="context-menu" id="contextMenu">
  <button class="menu-item" data-action="edit">✏️ 编辑</button>
  <button class="menu-item" data-action="copy">📋 复制任务</button>
  <div class="menu-divider"></div>
  <button class="menu-item" data-action="move-todo">📌 移至待处理</button>
  <button class="menu-item" data-action="move-progress">🔄 移至进行中</button>
  <button class="menu-item" data-action="move-done">✅ 移至已完成</button>
  <div class="menu-divider"></div>
  <button class="menu-item danger" data-action="delete">🗑 删除</button>
</div>

<!-- 卡片组右键菜单 -->
<div class="context-menu" id="groupContextMenu">
  <button class="menu-item" data-action="group-edit">✏️ 编辑标题</button>
  <button class="menu-item" data-action="group-copy">📋 复制卡片组</button>
  <div class="menu-divider"></div>
  <button class="menu-item" data-action="group-move-todo">📌 移至待处理</button>
  <button class="menu-item" data-action="group-move-progress">🔄 移至进行中</button>
  <button class="menu-item" data-action="group-move-done">✅ 移至已完成</button>
  <div class="menu-divider"></div>
  <button class="menu-item danger" data-action="group-delete">🗑️ 删除卡片组</button>
</div>

<div id="modalContainer"></div>
<div id="toastContainer"></div>

<script src="app.js"></script>
<script src="group-manager.js"></script>

</body>
</html>
