<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23f5c518'/><text x='32' y='46' text-anchor='middle' font-size='38' font-family='system-ui,sans-serif' font-weight='700' fill='%23ffffff'>M</text></svg>">
<title>个人任务管理工具</title>
<style>
/* ==================== CSS 变量 & 全局重置 ==================== */
:root {
  --bg-page: #fff9e6;
  --bg-column: rgba(255,255,255,0.72);
  --border-column: #e8e4d9;
  --text-primary: #1a1a2e;
  --text-secondary: #6b7280;
  --text-muted: #9ca3af;
  --shadow-card: 0 1px 3px rgba(0,0,0,0.04), 0 2px 10px rgba(0,0,0,0.06);
  --shadow-card-hover: 0 2px 6px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.08);
  --radius-card: 10px;
  --radius-tag: 6px;
  --radius-column: 14px;
  --radius-modal: 16px;
  --transition-fast: 0.15s ease;
  --transition-normal: 0.25s ease;
  --color-high-bg: #fde8e8;
  --color-high-text: #c53030;
  --color-mid-bg: #fef6e4;
  --color-mid-text: #b7791f;
  --color-low-bg: #e6f5ea;
  --color-low-text: #2f855a;
  --color-tag-bg: #eef2f7;
  --color-tag-text: #4a5568;
  --color-col-todo: #8b9dc3;
  --color-col-progress: #7c8ce0;
  --color-col-done: #5a9e6f;
  --blur-glass: 8px;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Microsoft YaHei", "Helvetica Neue", sans-serif;
  background: linear-gradient(135deg, #fff9e6 0%, #fefce8 30%, #fdf6e3 100%);
  min-height: 100vh;
  color: var(--text-primary);
  letter-spacing: 0.01em;
  user-select: none;
}

/* ==================== 顶部导航栏 ==================== */
.header {
  max-width: 1300px;
  margin: 0 auto;
  padding: 20px 24px 0;
}

.header h1 {
  font-size: 22px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 14px;
  letter-spacing: -0.02em;
}

/* 统计看板 */
.stats-bar {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.stat-item {
  background: rgba(255,255,255,0.8);
  backdrop-filter: blur(var(--blur-glass));
  -webkit-backdrop-filter: blur(var(--blur-glass));
  border: 1px solid var(--border-column);
  border-radius: 10px;
  padding: 8px 16px;
  font-size: 13px;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  gap: 6px;
}

.stat-item .stat-num {
  font-weight: 700;
  font-size: 18px;
  color: var(--text-primary);
  min-width: 24px;
  text-align: center;
}

.stat-item.done .stat-num { color: var(--color-col-done); }
.stat-item.undone .stat-num { color: var(--color-col-progress); }

/* 筛选排序栏 */
.filter-bar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 16px;
}

.filter-bar select,
.filter-bar input {
  padding: 6px 12px;
  border: 1px solid var(--border-column);
  border-radius: 8px;
  font-size: 13px;
  color: var(--text-primary);
  background: rgba(255,255,255,0.75);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  outline: none;
  cursor: pointer;
  transition: border-color var(--transition-fast);
  font-family: inherit;
}

.filter-bar select:focus,
.filter-bar input:focus {
  border-color: #7c8ce0;
}

.filter-bar label {
  font-size: 12px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 4px;
}

/* 批量操作栏 */
.batch-bar {
  display: none;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
  padding: 10px 16px;
  background: rgba(254,226,226,0.85);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  border: 1px solid #fca5a5;
  border-radius: 10px;
}

.batch-bar.visible {
  display: flex;
}

.batch-bar .batch-count {
  font-size: 13px;
  color: #991b1b;
  font-weight: 500;
}

.btn-batch-delete {
  padding: 6px 16px;
  background: #dc2626;
  color: #fff;
  border: none;
  border-radius: 7px;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
  transition: background var(--transition-fast);
}

.btn-batch-delete:hover {
  background: #b91c1c;
}

.btn-batch-cancel {
  padding: 6px 14px;
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid #d1d5db;
  border-radius: 7px;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
  transition: all var(--transition-fast);
}

.btn-batch-cancel:hover {
  background: #f3f4f6;
}

/* ==================== 看板三列布局 ==================== */
.board {
  max-width: 1300px;
  margin: 0 auto;
  padding: 0 24px 40px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
  align-items: start;
}

.column {
  background: rgba(255,255,255,0.65);
  backdrop-filter: blur(var(--blur-glass));
  -webkit-backdrop-filter: blur(var(--blur-glass));
  border: 1px solid var(--border-column);
  border-radius: var(--radius-column);
  padding: 14px;
  min-height: 300px;
  display: flex;
  flex-direction: column;
  transition: box-shadow var(--transition-normal), border-color var(--transition-normal);
}

.column.drag-over {
  box-shadow: 0 0 0 2px rgba(124,140,224,0.35), 0 4px 20px rgba(124,140,224,0.12);
  border-color: #bcc4f0;
}

/* 列顶装饰条 */
.column::before {
  content: '';
  display: block;
  height: 3px;
  border-radius: 0 0 3px 3px;
  margin: -14px -14px 12px -14px;
}

.column.col-todo::before { background: var(--color-col-todo); }
.column.col-progress::before { background: var(--color-col-progress); }
.column.col-done::before { background: var(--color-col-done); }

.column-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.column-header .col-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 8px;
}

.column-header .col-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 22px;
  height: 22px;
  padding: 0 6px;
  background: rgba(0,0,0,0.06);
  border-radius: 11px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-secondary);
}

.btn-add-task {
  width: 28px;
  height: 28px;
  border-radius: 7px;
  border: 1px solid var(--border-column);
  background: rgba(255,255,255,0.8);
  color: var(--text-secondary);
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
  transition: all var(--transition-fast);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}

.btn-add-task:hover {
  background: #fff;
  border-color: #bcc4f0;
  color: var(--color-col-progress);
  box-shadow: var(--shadow-card);
}

/* 卡片列表 */
.card-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex: 1;
  min-height: 60px;
}

/* 列内placeholder */
.column-placeholder {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  font-size: 13px;
  pointer-events: none;
}

/* ==================== 任务卡片 ==================== */
.task-card {
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  border: 1px solid rgba(0,0,0,0.06);
  border-radius: var(--radius-card);
  padding: 14px 16px;
  cursor: grab;
  position: relative;
  box-shadow: var(--shadow-card);
  transition: box-shadow var(--transition-normal), transform var(--transition-fast),
    border-color var(--transition-normal);
  animation: cardIn 0.25s ease;
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.task-card:hover {
  box-shadow: var(--shadow-card-hover);
  border-color: rgba(0,0,0,0.1);
}

.task-card:active {
  cursor: grabbing;
}

.task-card.dragging {
  opacity: 0.5;
  transform: scale(0.96);
}

/* 复选框 */
.task-card .card-checkbox {
  position: absolute;
  top: 10px;
  left: 10px;
  width: 16px;
  height: 16px;
  cursor: pointer;
  accent-color: #dc2626;
  opacity: 0;
  transition: opacity var(--transition-fast);
  z-index: 1;
}

.task-card:hover .card-checkbox,
.task-card .card-checkbox:checked {
  opacity: 1;
}

/* 卡片标题 */
.task-card .card-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 6px;
  line-height: 1.4;
  padding-left: 0;
  transition: padding-left var(--transition-fast);
}

/* 卡片描述预览 */
.task-card .card-desc {
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 8px;
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* 卡片底部信息行 */
.task-card .card-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.task-card .card-meta .due-date {
  font-size: 11px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 3px;
}

.task-card .card-meta .due-date.overdue {
  color: #dc2626;
  font-weight: 500;
}

/* 优先级标签 */
.priority-tag {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 2px 8px;
  border-radius: var(--radius-tag);
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
}

.priority-tag.high {
  background: var(--color-high-bg);
  color: var(--color-high-text);
}

.priority-tag.medium {
  background: var(--color-mid-bg);
  color: var(--color-mid-text);
}

.priority-tag.low {
  background: var(--color-low-bg);
  color: var(--color-low-text);
}

/* 分类标签 */
.category-tags {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}

.category-tag {
  display: inline-block;
  padding: 1px 7px;
  border-radius: 4px;
  background: var(--color-tag-bg);
  color: var(--color-tag-text);
  font-size: 11px;
  font-weight: 500;
  white-space: nowrap;
}

/* ==================== 右键菜单 ==================== */
.context-menu {
  position: fixed;
  z-index: 1000;
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border-column);
  border-radius: 10px;
  padding: 4px 0;
  min-width: 150px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.12), 0 1px 4px rgba(0,0,0,0.06);
  opacity: 0;
  transform: scale(0.92);
  pointer-events: none;
  transition: opacity 0.12s ease, transform 0.12s ease;
}

.context-menu.show {
  opacity: 1;
  transform: scale(1);
  pointer-events: auto;
}

.context-menu .menu-item {
  display: block;
  width: 100%;
  padding: 8px 16px;
  border: none;
  background: transparent;
  font-size: 13px;
  color: var(--text-primary);
  cursor: pointer;
  text-align: left;
  font-family: inherit;
  transition: background var(--transition-fast);
}

.context-menu .menu-item:hover {
  background: #f3f4f6;
}

.context-menu .menu-item.danger {
  color: #dc2626;
}

.context-menu .menu-item.danger:hover {
  background: #fef2f2;
}

.context-menu .menu-divider {
  height: 1px;
  background: var(--border-column);
  margin: 3px 8px;
}

/* ==================== Modal 弹窗 ==================== */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 900;
  background: rgba(0,0,0,0.3);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  display: flex;
  align-items: center;
  justify-content: center;
  animation: fadeIn 0.2s ease;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal {
  background: #fff;
  border-radius: var(--radius-modal);
  padding: 24px 28px;
  width: 480px;
  max-width: 94vw;
  max-height: 85vh;
  overflow-y: auto;
  box-shadow: 0 8px 40px rgba(0,0,0,0.15);
  animation: modalIn 0.25s ease;
}

@keyframes modalIn {
  from { opacity: 0; transform: translateY(20px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.modal h2 {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 18px;
  color: var(--text-primary);
}

.modal .form-group {
  margin-bottom: 14px;
}

.modal .form-group label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 5px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.modal .form-group input,
.modal .form-group textarea,
.modal .form-group select {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
  color: var(--text-primary);
  outline: none;
  transition: border-color var(--transition-fast);
}

.modal .form-group input:focus,
.modal .form-group textarea:focus,
.modal .form-group select:focus {
  border-color: #7c8ce0;
  box-shadow: 0 0 0 3px rgba(124,140,224,0.1);
}

.modal .form-group textarea {
  resize: vertical;
  min-height: 80px;
}

/* 标签输入区 */
.tag-input-wrapper {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  padding: 6px 8px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  min-height: 38px;
  background: #fff;
  transition: border-color var(--transition-fast);
}

.tag-input-wrapper:focus-within {
  border-color: #7c8ce0;
  box-shadow: 0 0 0 3px rgba(124,140,224,0.1);
}

.tag-input-wrapper .tag-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  background: var(--color-tag-bg);
  color: var(--color-tag-text);
  border-radius: 4px;
  font-size: 12px;
  font-weight: 500;
}

.tag-input-wrapper .tag-chip .tag-remove {
  cursor: pointer;
  font-size: 14px;
  line-height: 1;
  color: #9ca3af;
  transition: color var(--transition-fast);
}

.tag-input-wrapper .tag-chip .tag-remove:hover {
  color: #dc2626;
}

.tag-input-wrapper input.tag-input {
  border: none;
  outline: none;
  flex: 1;
  min-width: 80px;
  font-size: 13px;
  padding: 2px 4px;
  font-family: inherit;
  background: transparent;
  box-shadow: none;
}

.modal .form-actions {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  margin-top: 20px;
}

.btn-primary {
  padding: 8px 20px;
  background: #4f6ef7;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  transition: background var(--transition-fast);
}

.btn-primary:hover {
  background: #3b54d4;
}

.btn-secondary {
  padding: 8px 20px;
  background: #f3f4f6;
  color: var(--text-primary);
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 14px;
  cursor: pointer;
  font-family: inherit;
  transition: background var(--transition-fast);
}

.btn-secondary:hover {
  background: #e5e7eb;
}

/* ==================== 响应式 ==================== */
@media (max-width: 900px) {
  .board {
    grid-template-columns: 1fr;
    gap: 14px;
  }
}

@media (min-width: 901px) and (max-width: 1100px) {
  .board {
    gap: 12px;
  }
  .task-card {
    padding: 10px 12px;
  }
}

/* ==================== 滚动条美化 ==================== */
::-webkit-scrollbar {
  width: 6px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: #d1d5db;
  border-radius: 3px;
}

::-webkit-scrollbar-thumb:hover {
  background: #9ca3af;
}

/* ==================== Toast 提示 ==================== */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2000;
  background: #1a1a2e;
  color: #fff;
  padding: 10px 22px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 500;
  pointer-events: none;
  animation: toastIn 0.3s ease, toastOut 0.3s ease 1.7s forwards;
  white-space: nowrap;
}

@keyframes toastIn {
  from { opacity: 0; transform: translateX(-50%) translateY(12px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

@keyframes toastOut {
  from { opacity: 1; transform: translateX(-50%) translateY(0); }
  to { opacity: 0; transform: translateX(-50%) translateY(12px); }
}

/* ==================== 进展记录相关 ==================== */
.card-progress-summary {
  margin-top: 6px;
  padding-top: 6px;
  border-top: 1px dashed #e5e7eb;
  font-size: 11px;
  color: #7c8ce0;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: color var(--transition-fast);
}
.card-progress-summary:hover {
  color: #4f6ef7;
  text-decoration: underline;
}

.progress-history {
  max-height: 260px;
  overflow-y: auto;
  margin-bottom: 14px;
}

.progress-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid #f3f4f6;
  position: relative;
  transition: background var(--transition-fast);
}
.progress-item:last-child {
  border-bottom: none;
}
.progress-item:hover .progress-delete {
  opacity: 1;
}

.progress-avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: #eef2ff;
  color: #4f6ef7;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  flex-shrink: 0;
  font-weight: 600;
}

.progress-content {
  flex: 1;
  min-width: 0;
}
.progress-text {
  font-size: 13px;
  color: var(--text-primary);
  line-height: 1.5;
  word-break: break-word;
}
.progress-time {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 3px;
}

.progress-delete {
  opacity: 0;
  width: 22px;
  height: 22px;
  border-radius: 5px;
  border: 1px solid #e5e7eb;
  background: #fff;
  color: #9ca3af;
  cursor: pointer;
  font-size: 14px;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all var(--transition-fast);
}
.progress-delete:hover {
  background: #fef2f2;
  border-color: #fca5a5;
  color: #dc2626;
}

.progress-empty {
  text-align: center;
  padding: 24px 0;
  color: var(--text-muted);
  font-size: 13px;
}

.progress-add-bar {
  display: flex;
  gap: 8px;
  align-items: flex-end;
}
.progress-add-bar textarea {
  flex: 1;
  min-height: 36px;
  max-height: 120px;
  padding: 8px 12px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 13px;
  font-family: inherit;
  color: var(--text-primary);
  outline: none;
  resize: none;
  transition: border-color var(--transition-fast);
}
.progress-add-bar textarea:focus {
  border-color: #7c8ce0;
  box-shadow: 0 0 0 3px rgba(124,140,224,0.1);
}
.btn-progress-add {
  padding: 7px 16px;
  background: #4f6ef7;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
  transition: background var(--transition-fast);
  flex-shrink: 0;
}
.btn-progress-add:hover {
  background: #3b54d4;
}
</style>
</head>
<body>

<!-- ==================== HTML 结构 ==================== -->

<!-- 顶部导航 -->
<header class="header">
  <h1>📋 任务看板</h1>

  <!-- 统计看板 -->
  <div class="stats-bar" id="statsBar">
    <div class="stat-item">
      总任务 <span class="stat-num" id="statTotal">0</span>
    </div>
    <div class="stat-item done">
      ✅ 已完成 <span class="stat-num" id="statDone">0</span>
    </div>
    <div class="stat-item undone">
      ⏳ 未完成 <span class="stat-num" id="statUndone">0</span>
    </div>
  </div>

  <!-- 筛选排序栏 -->
  <div class="filter-bar" id="filterBar">
    <label>优先级
      <select id="filterPriority">
        <option value="all">全部</option>
        <option value="high">🔴 高</option>
        <option value="medium">🟡 中</option>
        <option value="low">🟢 低</option>
      </select>
    </label>
    <label>标签
      <select id="filterTag">
        <option value="all">全部</option>
      </select>
    </label>
    <label>截止日期
      <select id="filterDate">
        <option value="all">全部</option>
        <option value="today">今天</option>
        <option value="week">本周</option>
        <option value="month">本月</option>
      </select>
    </label>
    <label>排序
      <select id="sortBy">
        <option value="created">创建时间</option>
        <option value="dueDate">截止日期</option>
        <option value="priority">优先级</option>
      </select>
    </label>
  </div>

  <!-- 批量操作栏 -->
  <div class="batch-bar" id="batchBar">
    <span class="batch-count" id="batchCount">已选择 0 项</span>
    <button class="btn-batch-delete" id="btnBatchDelete">删除选中</button>
    <button class="btn-batch-cancel" id="btnBatchCancel">取消选择</button>
  </div>
</header>

<!-- 三列看板 -->
<main class="board" id="board">
  <!-- 待处理列 -->
  <div class="column col-todo" data-status="todo" id="colTodo">
    <div class="column-header">
      <span class="col-title">
        📌 待处理
        <span class="col-count" id="countTodo">0</span>
      </span>
      <button class="btn-add-task" data-status="todo" title="新增待处理任务">+</button>
    </div>
    <div class="card-list" id="listTodo"></div>
  </div>

  <!-- 进行中列 -->
  <div class="column col-progress" data-status="in-progress" id="colInProgress">
    <div class="column-header">
      <span class="col-title">
        🔄 进行中
        <span class="col-count" id="countInProgress">0</span>
      </span>
      <button class="btn-add-task" data-status="in-progress" title="新增进行中任务">+</button>
    </div>
    <div class="card-list" id="listInProgress"></div>
  </div>

  <!-- 已完成列 -->
  <div class="column col-done" data-status="done" id="colDone">
    <div class="column-header">
      <span class="col-title">
        ✅ 已完成
        <span class="col-count" id="countDone">0</span>
      </span>
      <button class="btn-add-task" data-status="done" title="新增已完成任务">+</button>
    </div>
    <div class="card-list" id="listDone"></div>
  </div>
</main>

<!-- 右键菜单 -->
<div class="context-menu" id="contextMenu">
  <button class="menu-item" data-action="edit">✏️ 编辑</button>
  <button class="menu-item" data-action="copy">📋 复制任务</button>
  <div class="menu-divider"></div>
  <button class="menu-item" data-action="move-todo">📌 移至待处理</button>
  <button class="menu-item" data-action="move-progress">🔄 移至进行中</button>
  <button class="menu-item" data-action="move-done">✅ 移至已完成</button>
  <div class="menu-divider"></div>
  <button class="menu-item danger" data-action="delete">🗑 删除</button>
</div>

<!-- Modal 弹窗容器 -->
<div id="modalContainer"></div>

<!-- Toast 容器 -->
<div id="toastContainer"></div>

<!-- ==================== JavaScript 核心逻辑 ==================== -->
<script>
'use strict';

/* ============================
 * TaskManager — 数据管理层
 * 负责：CRUD 操作 + localStorage 持久化
 * ============================ */
class TaskManager {
  constructor(storageKey = 'task-board-data') {
    this.storageKey = storageKey;
    this.tasks = this._loadFromStorage();
    // 迁移旧数据（确保所有任务都有 tags 字段）
    this.tasks = this.tasks.map(t => ({
      id: t.id || crypto.randomUUID(),
      title: t.title || '',
      description: t.description || '',
      dueDate: t.dueDate || '',
      priority: t.priority || 'medium',
      tags: Array.isArray(t.tags) ? t.tags : [],
      status: t.status || 'todo',
      createdAt: t.createdAt || Date.now(),
      progress: Array.isArray(t.progress) ? t.progress : []
    }));
    this._saveToStorage();
  }

  /** 从 localStorage 读取数据 */
  _loadFromStorage() {
    try {
      const raw = localStorage.getItem(this.storageKey);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      console.warn('localStorage 读取失败，将使用空数据', e);
      return [];
    }
  }

  /** 保存数据到 localStorage */
  _saveToStorage() {
    try {
      localStorage.setItem(this.storageKey, JSON.stringify(this.tasks));
    } catch (e) {
      console.error('localStorage 写入失败', e);
      this._showToast('⚠️ 数据保存失败，请检查浏览器存储空间');
    }
  }

  /** Toast 提示（简化版，由 UIManager 统一管理） */
  _showToast(msg) {
    // 由外部设置
    if (this._toastFn) this._toastFn(msg);
  }

  /** 获取所有任务 */
  getAll() {
    return this.tasks;
  }

  /** 根据ID获取任务 */
  getById(id) {
    return this.tasks.find(t => t.id === id) || null;
  }

  /** 新增任务 */
  add(taskData) {
    const task = {
      id: crypto.randomUUID(),
      title: taskData.title || '未命名任务',
      description: taskData.description || '',
      dueDate: taskData.dueDate || '',
      priority: taskData.priority || 'medium',
      tags: Array.isArray(taskData.tags) ? [...taskData.tags] : [],
      status: taskData.status || 'todo',
      createdAt: Date.now()
    };
    this.tasks.push(task);
    this._saveToStorage();
    return task;
  }

  /** 更新任务 */
  update(id, updates) {
    const idx = this.tasks.findIndex(t => t.id === id);
    if (idx === -1) return null;
    this.tasks[idx] = { ...this.tasks[idx], ...updates };
    this._saveToStorage();
    return this.tasks[idx];
  }

  /** 删除任务 */
  delete(id) {
    const idx = this.tasks.findIndex(t => t.id === id);
    if (idx === -1) return false;
    this.tasks.splice(idx, 1);
    this._saveToStorage();
    return true;
  }

  /** 批量删除 */
  deleteMany(ids) {
    const idSet = new Set(ids);
    this.tasks = this.tasks.filter(t => !idSet.has(t.id));
    this._saveToStorage();
  }

  /** 复制任务 */
  copy(id) {
    const original = this.getById(id);
    if (!original) return null;
    const copy = {
      ...original,
      id: crypto.randomUUID(),
      title: original.title + ' (副本)',
      createdAt: Date.now(),
      progress: original.progress ? original.progress.map(p => ({...p})) : []
    };
    this.tasks.push(copy);
    this._saveToStorage();
    return copy;
  }

  /** 添加进展记录 */
  addProgress(taskId, text) {
    const task = this.getById(taskId);
    if (!task) return null;
    if (!Array.isArray(task.progress)) task.progress = [];
    const record = { text: text.trim(), time: Date.now() };
    task.progress.push(record);
    this._saveToStorage();
    return record;
  }

  /** 删除进展记录 */
  deleteProgress(taskId, index) {
    const task = this.getById(taskId);
    if (!task || !Array.isArray(task.progress)) return false;
    if (index < 0 || index >= task.progress.length) return false;
    task.progress.splice(index, 1);
    this._saveToStorage();
    return true;
  }

  /** 获取筛选后的任务（不修改原数组） */
  getFilteredAndSorted(filters, sortBy) {
    let result = [...this.tasks];

    // 优先级筛选
    if (filters.priority && filters.priority !== 'all') {
      result = result.filter(t => t.priority === filters.priority);
    }

    // 标签筛选
    if (filters.tag && filters.tag !== 'all') {
      result = result.filter(t => t.tags && t.tags.includes(filters.tag));
    }

    // 日期筛选
    if (filters.date && filters.date !== 'all') {
      const now = new Date();
      const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const todayEnd = new Date(todayStart.getTime() + 86400000);

      if (filters.date === 'today') {
        result = result.filter(t => {
          if (!t.dueDate) return false;
          const d = new Date(t.dueDate + 'T00:00:00');
          return d >= todayStart && d < todayEnd;
        });
      } else if (filters.date === 'week') {
        const dayOfWeek = now.getDay() || 7; // 周日为7
        const weekStart = new Date(todayStart);
        weekStart.setDate(weekStart.getDate() - dayOfWeek + 1); // 周一
        const weekEnd = new Date(weekStart);
        weekEnd.setDate(weekEnd.getDate() + 7);
        result = result.filter(t => {
          if (!t.dueDate) return false;
          const d = new Date(t.dueDate + 'T00:00:00');
          return d >= weekStart && d < weekEnd;
        });
      } else if (filters.date === 'month') {
        const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
        const monthEnd = new Date(now.getFullYear(), now.getMonth() + 1, 1);
        result = result.filter(t => {
          if (!t.dueDate) return false;
          const d = new Date(t.dueDate + 'T00:00:00');
          return d >= monthStart && d < monthEnd;
        });
      }
    }

    // 排序
    if (sortBy === 'dueDate') {
      result.sort((a, b) => {
        if (!a.dueDate && !b.dueDate) return 0;
        if (!a.dueDate) return 1;
        if (!b.dueDate) return -1;
        return new Date(a.dueDate) - new Date(b.dueDate);
      });
    } else if (sortBy === 'priority') {
      const order = { high: 0, medium: 1, low: 2 };
      result.sort((a, b) => (order[a.priority] ?? 1) - (order[b.priority] ?? 1));
    } else {
      // 默认按创建时间倒序
      result.sort((a, b) => b.createdAt - a.createdAt);
    }

    return result;
  }

  /** 获取所有使用过的标签 */
  getAllTags() {
    const tagSet = new Set();
    this.tasks.forEach(t => {
      if (Array.isArray(t.tags)) {
        t.tags.forEach(tag => tagSet.add(tag));
      }
    });
    return [...tagSet].sort();
  }

  /** 获取统计数据 */
  getStats() {
    const total = this.tasks.length;
    const done = this.tasks.filter(t => t.status === 'done').length;
    return { total, done, undone: total - done };
  }
}

/* ============================
 * UIManager — UI 渲染与交互层
 * 负责：渲染看板、卡片、Modal、右键菜单等
 * ============================ */
class UIManager {
  constructor(taskManager) {
    this.tm = taskManager;
    this.draggingTaskId = null;
    this.selectedCardIds = new Set(); // 批量选中的卡片ID集合
    this.contextMenuTargetId = null;   // 右键菜单目标卡片ID

    // DOM 引用缓存
    this.cacheDom();

    // 绑定事件
    this.bindEvents();

    // 初始渲染
    this.refreshAll();
  }

  cacheDom() {
    this.$board = document.getElementById('board');
    this.$statsBar = document.getElementById('statsBar');
    this.$filterBar = document.getElementById('filterBar');
    this.$batchBar = document.getElementById('batchBar');
    this.$batchCount = document.getElementById('batchCount');
    this.$contextMenu = document.getElementById('contextMenu');
    this.$modalContainer = document.getElementById('modalContainer');
    this.$toastContainer = document.getElementById('toastContainer');

    // 统计数字
    this.$statTotal = document.getElementById('statTotal');
    this.$statDone = document.getElementById('statDone');
    this.$statUndone = document.getElementById('statUndone');

    // 筛选控件
    this.$filterPriority = document.getElementById('filterPriority');
    this.$filterTag = document.getElementById('filterTag');
    this.$filterDate = document.getElementById('filterDate');
    this.$sortBy = document.getElementById('sortBy');

    // 批量操作按钮
    this.$btnBatchDelete = document.getElementById('btnBatchDelete');
    this.$btnBatchCancel = document.getElementById('btnBatchCancel');

    // 列相关
    this.columnMap = {
      'todo': { list: document.getElementById('listTodo'), count: document.getElementById('countTodo') },
      'in-progress': { list: document.getElementById('listInProgress'), count: document.getElementById('countInProgress') },
      'done': { list: document.getElementById('listDone'), count: document.getElementById('countDone') }
    };
  }

  /* ---------- 事件绑定（事件委托） ---------- */
  bindEvents() {
    // 新增任务按钮
    document.querySelectorAll('.btn-add-task').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const status = e.currentTarget.dataset.status;
        this.openModal(null, status);
      });
    });

    // 看板事件委托：双击编辑、点击进展、拖拽、复选框
    this.$board.addEventListener('dblclick', (e) => {
      // 如果双击的是进展摘要区域，不触发编辑
      if (e.target.closest('[data-action="progress"]')) return;
      const card = e.target.closest('.task-card');
      if (card) {
        const taskId = card.dataset.taskId;
        this.openModal(taskId);
      }
    });

    // 点击进展摘要（使用 click 而非 dblclick，避免与编辑冲突）
    this.$board.addEventListener('click', (e) => {
      const progressBtn = e.target.closest('[data-action="progress"]');
      if (progressBtn) {
        e.stopPropagation();
        const taskId = progressBtn.dataset.taskId;
        this.openProgressModal(taskId);
      }
    });

    // 拖拽事件（HTML5 Drag & Drop）
    this.$board.addEventListener('dragstart', (e) => {
      const card = e.target.closest('.task-card');
      if (!card) return;
      this.draggingTaskId = card.dataset.taskId;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', card.dataset.taskId);
    });

    this.$board.addEventListener('dragend', (e) => {
      const card = e.target.closest('.task-card');
      if (card) card.classList.remove('dragging');
      this.draggingTaskId = null;
      // 移除所有列的高亮
      document.querySelectorAll('.column').forEach(col => col.classList.remove('drag-over'));
    });

    // 让列接受拖放
    document.querySelectorAll('.column').forEach(column => {
      column.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        column.classList.add('drag-over');
      });

      column.addEventListener('dragleave', (e) => {
        // 仅在离开列本身时移除高亮
        if (!column.contains(e.relatedTarget)) {
          column.classList.remove('drag-over');
        }
      });

      column.addEventListener('drop', (e) => {
        e.preventDefault();
        column.classList.remove('drag-over');
        const taskId = e.dataTransfer.getData('text/plain');
        const newStatus = column.dataset.status;
        if (taskId && newStatus) {
          this.moveTask(taskId, newStatus);
        }
      });
    });

    // 右键菜单
    this.$board.addEventListener('contextmenu', (e) => {
      const card = e.target.closest('.task-card');
      if (card) {
        e.preventDefault();
        this.contextMenuTargetId = card.dataset.taskId;
        this.showContextMenu(e.clientX, e.clientY);
      }
    });

    // 点击其他地方关闭右键菜单
    document.addEventListener('click', (e) => {
      if (!this.$contextMenu.contains(e.target)) {
        this.hideContextMenu();
      }
    });

    // 右键菜单项点击
    this.$contextMenu.addEventListener('click', (e) => {
      const menuItem = e.target.closest('.menu-item');
      if (!menuItem) return;
      const action = menuItem.dataset.action;
      this.handleContextAction(action, this.contextMenuTargetId);
      this.hideContextMenu();
    });

    // 复选框变化
    this.$board.addEventListener('change', (e) => {
      if (e.target.classList.contains('card-checkbox')) {
        const taskId = e.target.dataset.taskId;
        if (e.target.checked) {
          this.selectedCardIds.add(taskId);
        } else {
          this.selectedCardIds.delete(taskId);
        }
        this.updateBatchBar();
      }
    });

    // 批量删除
    this.$btnBatchDelete.addEventListener('click', () => {
      if (this.selectedCardIds.size === 0) return;
      if (confirm(`确定要删除选中的 ${this.selectedCardIds.size} 个任务吗？此操作不可撤销。`)) {
        this.tm.deleteMany([...this.selectedCardIds]);
        this.selectedCardIds.clear();
        this.updateBatchBar();
        this.refreshAll();
        this.showToast('已删除选中任务');
      }
    });

    // 取消批量选择
    this.$btnBatchCancel.addEventListener('click', () => {
      this.selectedCardIds.clear();
      this.updateBatchBar();
      this.refreshAll();
    });

    // 筛选排序控件变化
    [this.$filterPriority, this.$filterTag, this.$filterDate, this.$sortBy].forEach(el => {
      el.addEventListener('change', () => this.refreshBoard());
    });

    // 页面关闭前保存数据
    window.addEventListener('beforeunload', () => {
      this.tm._saveToStorage();
    });
  }

  /* ---------- 数据刷新 ---------- */
  refreshAll() {
    this.refreshBoard();
    this.refreshStats();
    this.refreshTagFilter();
  }

  refreshBoard() {
    const filters = {
      priority: this.$filterPriority.value,
      tag: this.$filterTag.value,
      date: this.$filterDate.value
    };
    const sortBy = this.$sortBy.value;
    const filteredTasks = this.tm.getFilteredAndSorted(filters, sortBy);

    // 按状态分组
    const grouped = { 'todo': [], 'in-progress': [], 'done': [] };
    filteredTasks.forEach(t => {
      if (grouped[t.status]) grouped[t.status].push(t);
      else grouped['todo'].push(t);
    });

    // 渲染每列
    Object.entries(grouped).forEach(([status, tasks]) => {
      const col = this.columnMap[status];
      if (!col) return;
      col.list.innerHTML = '';
      col.count.textContent = tasks.length;

      if (tasks.length === 0) {
        const placeholder = document.createElement('div');
        placeholder.className = 'column-placeholder';
        placeholder.textContent = '拖放任务到此处';
        col.list.appendChild(placeholder);
      } else {
        tasks.forEach(task => {
          const card = this.createCardElement(task);
          col.list.appendChild(card);
        });
      }
    });

    // 恢复复选框状态
    this.restoreCheckboxStates();
  }

  refreshStats() {
    const stats = this.tm.getStats();
    this.$statTotal.textContent = stats.total;
    this.$statDone.textContent = stats.done;
    this.$statUndone.textContent = stats.undone;
  }

  refreshTagFilter() {
    const tags = this.tm.getAllTags();
    const currentValue = this.$filterTag.value;
    this.$filterTag.innerHTML = '<option value="all">全部</option>';
    tags.forEach(tag => {
      const opt = document.createElement('option');
      opt.value = tag;
      opt.textContent = tag;
      this.$filterTag.appendChild(opt);
    });
    // 恢复之前选中的值
    if (tags.includes(currentValue)) {
      this.$filterTag.value = currentValue;
    }
  }

  /* ---------- 卡片DOM创建 ---------- */
  createCardElement(task) {
    const card = document.createElement('div');
    card.className = 'task-card';
    card.dataset.taskId = task.id;
    card.draggable = true;

    // 优先级标签文本
    const priorityLabels = { high: '🔴 高', medium: '🟡 中', low: '🟢 低' };
    const priorityClass = task.priority;

    // 截止日期显示
    let dueDateHtml = '';
    if (task.dueDate) {
      const dueDate = new Date(task.dueDate + 'T00:00:00');
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const isOverdue = dueDate < today && task.status !== 'done';
      const dateStr = task.dueDate;
      dueDateHtml = `<span class="due-date ${isOverdue ? 'overdue' : ''}">📅 ${dateStr}${isOverdue ? ' (已逾期)' : ''}</span>`;
    }

    // 标签
    let tagsHtml = '';
    if (task.tags && task.tags.length > 0) {
      tagsHtml = '<span class="category-tags">' +
        task.tags.map(t => `<span class="category-tag">${this.escapeHtml(t)}</span>`).join('') +
        '</span>';
    }

    // 描述预览
    let descHtml = '';
    if (task.description) {
      descHtml = `<div class="card-desc">${this.escapeHtml(task.description)}</div>`;
    }

    // 进展摘要
    const progressCount = (task.progress && task.progress.length) ? task.progress.length : 0;
    const progressSummaryHtml = progressCount > 0 
      ? `<div class="card-progress-summary" data-action="progress" data-task-id="${task.id}">💬 ${progressCount}条进展</div>`
      : '';

    card.innerHTML = `
      <input type="checkbox" class="card-checkbox" data-task-id="${task.id}">
      <div class="card-title">${this.escapeHtml(task.title)}</div>
      ${descHtml}
      <div class="card-meta">
        <span class="priority-tag ${priorityClass}">${priorityLabels[task.priority]}</span>
        ${tagsHtml}
        ${dueDateHtml}
      </div>
      ${progressSummaryHtml}
    `;

    return card;
  }

  /** HTML 转义 */
  escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  /* ---------- 复选框状态恢复 ---------- */
  restoreCheckboxStates() {
    this.selectedCardIds.forEach(taskId => {
      const cb = document.querySelector(`.card-checkbox[data-task-id="${taskId}"]`);
      if (cb) cb.checked = true;
    });
    this.updateBatchBar();
  }

  /* ---------- 批量操作栏 ---------- */
  updateBatchBar() {
    if (this.selectedCardIds.size > 0) {
      this.$batchBar.classList.add('visible');
      this.$batchCount.textContent = `已选择 ${this.selectedCardIds.size} 项`;
    } else {
      this.$batchBar.classList.remove('visible');
    }
  }

  /* ---------- 任务移动 ---------- */
  moveTask(taskId, newStatus) {
    const task = this.tm.getById(taskId);
    if (!task) return;
    if (task.status === newStatus) return; // 相同列不操作
    this.tm.update(taskId, { status: newStatus });
    this.refreshAll();
    const statusLabels = { 'todo': '待处理', 'in-progress': '进行中', 'done': '已完成' };
    this.showToast(`已移至「${statusLabels[newStatus]}」`);
  }

  /* ---------- 右键菜单 ---------- */
  showContextMenu(x, y) {
    this.$contextMenu.classList.add('show');
    // 确保菜单不超出窗口
    const menuRect = this.$contextMenu.getBoundingClientRect();
    let left = x;
    let top = y;
    if (left + 160 > window.innerWidth) left = window.innerWidth - 170;
    if (top + 220 > window.innerHeight) top = window.innerHeight - 230;
    this.$contextMenu.style.left = left + 'px';
    this.$contextMenu.style.top = top + 'px';
  }

  hideContextMenu() {
    this.$contextMenu.classList.remove('show');
    this.contextMenuTargetId = null;
  }

  handleContextAction(action, taskId) {
    if (!taskId) return;
    const task = this.tm.getById(taskId);
    if (!task) return;

    switch (action) {
      case 'edit':
        this.openModal(taskId);
        break;
      case 'copy':
        const copy = this.tm.copy(taskId);
        if (copy) {
          this.refreshAll();
          this.showToast('已复制任务');
        }
        break;
      case 'move-todo':
        this.moveTask(taskId, 'todo');
        break;
      case 'move-progress':
        this.moveTask(taskId, 'in-progress');
        break;
      case 'move-done':
        this.moveTask(taskId, 'done');
        break;
      case 'delete':
        if (confirm('确定要删除这个任务吗？')) {
          this.tm.delete(taskId);
          this.selectedCardIds.delete(taskId);
          this.updateBatchBar();
          this.refreshAll();
          this.showToast('已删除任务');
        }
        break;
    }
  }

  /* ---------- Modal 弹窗（新增 / 编辑） ---------- */
  openModal(taskIdOrNull, presetStatus) {
    const isEdit = taskIdOrNull !== null;
    const task = isEdit ? this.tm.getById(taskIdOrNull) : null;
    const initialStatus = isEdit ? task.status : (presetStatus || 'todo');
    const initialTags = isEdit ? (task.tags || []) : [];

    // 构建 Modal HTML
    const modalHtml = `
      <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modal">
          <h2>${isEdit ? '编辑任务' : '新增任务'}</h2>
          <div class="form-group">
            <label>标题 *</label>
            <input type="text" id="inputTitle" value="${isEdit ? this.escapeHtml(task.title) : ''}" placeholder="输入任务标题" autofocus>
          </div>
          <div class="form-group">
            <label>描述</label>
            <textarea id="inputDesc" placeholder="添加详细描述（可选）">${isEdit ? this.escapeHtml(task.description) : ''}</textarea>
          </div>
          <div class="form-group">
            <label>截止日期</label>
            <input type="date" id="inputDueDate" value="${isEdit ? task.dueDate : ''}">
          </div>
          <div class="form-group">
            <label>优先级</label>
            <select id="inputPriority">
              <option value="high" ${(isEdit && task.priority === 'high') ? 'selected' : ''}>🔴 高优先级</option>
              <option value="medium" ${(!isEdit || task.priority === 'medium') ? 'selected' : ''}>🟡 中优先级</option>
              <option value="low" ${(isEdit && task.priority === 'low') ? 'selected' : ''}>🟢 低优先级</option>
            </select>
          </div>
          <div class="form-group">
            <label>状态</label>
            <select id="inputStatus">
              <option value="todo" ${initialStatus === 'todo' ? 'selected' : ''}>📌 待处理</option>
              <option value="in-progress" ${initialStatus === 'in-progress' ? 'selected' : ''}>🔄 进行中</option>
              <option value="done" ${initialStatus === 'done' ? 'selected' : ''}>✅ 已完成</option>
            </select>
          </div>
          <div class="form-group">
            <label>标签</label>
            <div class="tag-input-wrapper" id="tagWrapper">
              ${initialTags.map(tag => `<span class="tag-chip"><span>${this.escapeHtml(tag)}</span><span class="tag-remove" data-tag="${this.escapeHtml(tag)}">&times;</span></span>`).join('')}
              <input type="text" class="tag-input" id="inputTag" placeholder="输入标签后回车">
            </div>
          </div>
          <div class="form-actions">
            <button class="btn-secondary" id="btnModalCancel">取消</button>
            <button class="btn-primary" id="btnModalSave">${isEdit ? '保存修改' : '创建任务'}</button>
          </div>
        </div>
      </div>
    `;

    this.$modalContainer.innerHTML = modalHtml;

    // 获取当前 Modal 中的引用
    const $overlay = document.getElementById('modalOverlay');
    const $modal = document.getElementById('modal');
    const $inputTitle = document.getElementById('inputTitle');
    const $inputDesc = document.getElementById('inputDesc');
    const $inputDueDate = document.getElementById('inputDueDate');
    const $inputPriority = document.getElementById('inputPriority');
    const $inputStatus = document.getElementById('inputStatus');
    const $tagWrapper = document.getElementById('tagWrapper');
    const $inputTag = document.getElementById('inputTag');
    let currentTags = [...initialTags];

    // 标签管理函数
    const renderTags = () => {
      // 保留 input
      const chips = $tagWrapper.querySelectorAll('.tag-chip');
      chips.forEach(c => c.remove());
      currentTags.forEach(tag => {
        const chip = document.createElement('span');
        chip.className = 'tag-chip';
        chip.innerHTML = `<span>${this.escapeHtml(tag)}</span><span class="tag-remove" data-tag="${this.escapeHtml(tag)}">&times;</span>`;
        chip.querySelector('.tag-remove').addEventListener('click', () => {
          currentTags = currentTags.filter(t => t !== tag);
          renderTags();
        });
        $tagWrapper.insertBefore(chip, $inputTag);
      });
    };

    const addTag = (tagName) => {
      const trimmed = tagName.trim();
      if (!trimmed) return;
      if (currentTags.includes(trimmed)) {
        $inputTag.value = '';
        return;
      }
      currentTags.push(trimmed);
      $inputTag.value = '';
      renderTags();
    };

    // 标签输入事件
    $inputTag.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        addTag($inputTag.value);
      } else if (e.key === 'Backspace' && $inputTag.value === '' && currentTags.length > 0) {
        // 删除最后一个标签
        currentTags.pop();
        renderTags();
      }
    });

    // 标签移除事件（事件委托）
    $tagWrapper.addEventListener('click', (e) => {
      const removeBtn = e.target.closest('.tag-remove');
      if (removeBtn) {
        const tag = removeBtn.dataset.tag;
        currentTags = currentTags.filter(t => t !== tag);
        renderTags();
      }
    });

    // 关闭 Modal
    const closeModal = () => {
      this.$modalContainer.innerHTML = '';
    };

    // 点击遮罩关闭
    $overlay.addEventListener('click', (e) => {
      if (e.target === $overlay) closeModal();
    });

    // 取消按钮
    document.getElementById('btnModalCancel').addEventListener('click', closeModal);

    // 保存按钮
    document.getElementById('btnModalSave').addEventListener('click', () => {
      const title = $inputTitle.value.trim();
      if (!title) {
        this.showToast('⚠️ 请输入任务标题');
        $inputTitle.focus();
        return;
      }

      const taskData = {
        title: title,
        description: $inputDesc.value.trim(),
        dueDate: $inputDueDate.value,
        priority: $inputPriority.value,
        status: $inputStatus.value,
        tags: currentTags
      };

      if (isEdit) {
        this.tm.update(taskIdOrNull, taskData);
        this.showToast('✅ 任务已更新');
      } else {
        this.tm.add(taskData);
        this.showToast('✅ 任务已创建');
      }

      closeModal();
      this.refreshAll();
    });

    // ESC 键关闭
    const escHandler = (e) => {
      if (e.key === 'Escape') {
        closeModal();
        document.removeEventListener('keydown', escHandler);
      }
    };
    document.addEventListener('keydown', escHandler);

    // 聚焦标题输入框
    setTimeout(() => $inputTitle.focus(), 100);
  }

  /* ---------- 进展记录 Modal ---------- */
  openProgressModal(taskId) {
    const task = this.tm.getById(taskId);
    if (!task) return;
    const progressList = Array.isArray(task.progress) ? task.progress : [];

    const formatTime = (timestamp) => {
      const d = new Date(timestamp);
      const pad = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    };

    const buildHistoryHtml = (plist) => {
      if (plist.length === 0) {
        return '<div class="progress-empty">暂无进展记录，在下方添加第一条</div>';
      }
      return plist.map((p, i) => ({...p, _rawIdx: i}))
        .sort((a, b) => b.time - a.time)
        .map(p => `
          <div class="progress-item">
            <div class="progress-avatar">💬</div>
            <div class="progress-content">
              <div class="progress-text">${this.escapeHtml(p.text)}</div>
              <div class="progress-time">${formatTime(p.time)}</div>
            </div>
            <button class="progress-delete" data-progress-index="${p._rawIdx}" title="删除此进展">&times;</button>
          </div>
        `).join('');
    };

    const modalHtml = `
      <div class="modal-overlay" id="progressOverlay">
        <div class="modal" id="progressModal" style="width:500px;">
          <h2>📝 进展记录</h2>
          <div style="margin-bottom:14px;font-size:14px;color:var(--text-secondary);">
            任务：<strong style="color:var(--text-primary);">${this.escapeHtml(task.title)}</strong>
          </div>
          <div class="progress-history" id="progressHistory">${buildHistoryHtml(progressList)}</div>
          <div class="progress-add-bar">
            <textarea id="progressInput" placeholder="输入进展内容…" rows="2"></textarea>
            <button class="btn-progress-add" id="btnProgressAdd">添加</button>
          </div>
          <div class="form-actions" style="margin-top:12px;">
            <button class="btn-secondary" id="btnProgressClose">关闭</button>
          </div>
        </div>
      </div>
    `;

    this.$modalContainer.innerHTML = modalHtml;

    const $overlay = document.getElementById('progressOverlay');
    const $historyContainer = document.getElementById('progressHistory');
    const $progressInput = document.getElementById('progressInput');
    const $btnAdd = document.getElementById('btnProgressAdd');
    const $btnClose = document.getElementById('btnProgressClose');

    const closeModal = () => {
      this.$modalContainer.innerHTML = '';
      this.refreshBoard();
    };

    const renderHistory = () => {
      const t = this.tm.getById(taskId);
      if (!t) return;
      const plist = Array.isArray(t.progress) ? t.progress : [];
      $historyContainer.innerHTML = buildHistoryHtml(plist);
      // 绑定删除事件
      $historyContainer.querySelectorAll('.progress-delete').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const idx = parseInt(btn.dataset.progressIndex, 10);
          if (!isNaN(idx) && confirm('确定要删除这条进展记录吗？')) {
            this.tm.deleteProgress(taskId, idx);
            renderHistory();
            this.refreshBoard();
          }
        });
      });
    };

    const addProgress = () => {
      const text = $progressInput.value.trim();
      if (!text) return;
      this.tm.addProgress(taskId, text);
      $progressInput.value = '';
      renderHistory();
      this.refreshBoard();
    };

    $btnAdd.addEventListener('click', addProgress);
    $progressInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        addProgress();
      }
    });

    $overlay.addEventListener('click', (e) => {
      if (e.target === $overlay) closeModal();
    });
    $btnClose.addEventListener('click', closeModal);

    const escHandler = (e) => {
      if (e.key === 'Escape') {
        closeModal();
        document.removeEventListener('keydown', escHandler);
      }
    };
    document.addEventListener('keydown', escHandler);

    // 初始绑定删除按钮
    setTimeout(() => {
      $historyContainer.querySelectorAll('.progress-delete').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const idx = parseInt(btn.dataset.progressIndex, 10);
          if (!isNaN(idx) && confirm('确定要删除这条进展记录吗？')) {
            this.tm.deleteProgress(taskId, idx);
            renderHistory();
            this.refreshBoard();
          }
        });
      });
    }, 0);

    setTimeout(() => $progressInput.focus(), 150);
  }

  /* ---------- Toast 提示 ---------- */
  showToast(msg) {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = msg;
    this.$toastContainer.appendChild(toast);

    // 自动移除
    setTimeout(() => {
      if (toast.parentNode) toast.parentNode.removeChild(toast);
    }, 2000);
  }
}

/* ============================
 * 应用初始化
 * ============================ */
document.addEventListener('DOMContentLoaded', () => {
  const taskManager = new TaskManager();
  const uiManager = new UIManager(taskManager);

  // 将 toast 方法注入 TaskManager
  taskManager._toastFn = (msg) => uiManager.showToast(msg);

  console.log('✅ 任务管理工具已就绪');
  console.log(`   - 共加载 ${taskManager.tasks.length} 个任务`);
  console.log('   - 数据存储在 localStorage key: task-board-data');
});
</script>
