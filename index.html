<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23f5c518'/><text x='32' y='46' text-anchor='middle' font-size='38' font-family='system-ui,sans-serif' font-weight='700' fill='%23ffffff'>M</text></svg>">

<title>个人任务管理工具</title>

<style>

/* ==================== CSS 变量 & 全局重置 ==================== */

:root {

  --bg-page: #fff9e6;

  --bg-column: rgba(255,255,255,0.72);

  --border-column: #e8e4d9;

  --text-primary: #1a1a2e;

  --text-secondary: #6b7280;

  --text-muted: #9ca3af;

  --shadow-card: 0 1px 3px rgba(0,0,0,0.04), 0 2px 10px rgba(0,0,0,0.06);

  --shadow-card-hover: 0 2px 6px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.08);

  --radius-card: 10px;

  --radius-tag: 6px;

  --radius-column: 14px;

  --radius-modal: 16px;

  --transition-fast: 0.15s ease;

  --transition-normal: 0.25s ease;

  --color-high-bg: #fde8e8;

  --color-high-text: #c53030;

  --color-mid-bg: #fef6e4;

  --color-mid-text: #b7791f;

  --color-low-bg: #e6f5ea;

  --color-low-text: #2f855a;

  --color-tag-bg: #eef2f7;

  --color-tag-text: #4a5568;

  --color-col-todo: #8b9dc3;

  --color-col-progress: #7c8ce0;

  --color-col-done: #5a9e6f;

  --blur-glass: 8px;

}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {

  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",

    "Microsoft YaHei", "Helvetica Neue", sans-serif;

  background: linear-gradient(135deg, #fff9e6 0%, #fefce8 30%, #fdf6e3 100%);

  min-height: 100vh;

  color: var(--text-primary);

  letter-spacing: 0.01em;

  user-select: none;

}

/* ==================== 顶部导航栏 ==================== */

.header {

  max-width: 1300px;

  margin: 0 auto;

  padding: 20px 24px 0;

}

.header h1 {

  font-size: 22px;

  font-weight: 700;

  color: var(--text-primary);

  margin-bottom: 14px;

  letter-spacing: -0.02em;

}

/* 统计看板 */

.stats-bar {

  display: flex;

  gap: 20px;

  flex-wrap: wrap;

  margin-bottom: 12px;

}

.stat-item {

  background: rgba(255,255,255,0.8);

  backdrop-filter: blur(var(--blur-glass));

  -webkit-backdrop-filter: blur(var(--blur-glass));

  border: 1px solid var(--border-column);

  border-radius: 10px;

  padding: 8px 16px;

  font-size: 13px;

  color: var(--text-secondary);

  display: flex;

  align-items: center;

  gap: 6px;

}

.stat-item .stat-num {

  font-weight: 700;

  font-size: 18px;

  color: var(--text-primary);

  min-width: 24px;

  text-align: center;

}

.stat-item.done .stat-num { color: var(--color-col-done); }

.stat-item.undone .stat-num { color: var(--color-col-progress); }

/* 筛选排序栏 */

.filter-bar {

  display: flex;

  gap: 10px;

  flex-wrap: wrap;

  align-items: center;

  margin-bottom: 16px;

}

.filter-bar select,

.filter-bar input {

  padding: 6px 12px;

  border: 1px solid var(--border-column);

  border-radius: 8px;

  font-size: 13px;

  color: var(--text-primary);

  background: rgba(255,255,255,0.75);

  backdrop-filter: blur(4px);

  -webkit-backdrop-filter: blur(4px);

  outline: none;

  cursor: pointer;

  transition: border-color var(--transition-fast);

  font-family: inherit;

}

.filter-bar select:focus,

.filter-bar input:focus {

  border-color: #7c8ce0;

}

.filter-bar label {

  font-size: 12px;

  color: var(--text-muted);

  display: flex;

  align-items: center;

  gap: 4px;

}

/* 批量操作栏 */

.batch-bar {

  display: none;

  align-items: center;

  gap: 12px;

  margin-bottom: 12px;

  padding: 10px 16px;

  background: rgba(254,226,226,0.85);

  backdrop-filter: blur(6px);

  -webkit-backdrop-filter: blur(6px);

  border: 1px solid #fca5a5;

  border-radius: 10px;

}

.batch-bar.visible { display: flex; }

.batch-bar .batch-count {

  font-size: 13px;

  color: #991b1b;

  font-weight: 500;

}

.btn-batch-delete {

  padding: 6px 16px;

  background: #dc2626;

  color: #fff;

  border: none;

  border-radius: 7px;

  font-size: 13px;

  cursor: pointer;

  font-family: inherit;

  transition: background var(--transition-fast);

}

.btn-batch-delete:hover { background: #b91c1c; }

.btn-batch-cancel {

  padding: 6px 14px;

  background: transparent;

  color: var(--text-secondary);

  border: 1px solid #d1d5db;

  border-radius: 7px;

  font-size: 13px;

  cursor: pointer;

  font-family: inherit;

  transition: all var(--transition-fast);

}

.btn-batch-cancel:hover { background: #f3f4f6; }

/* 数据目录控制 */

.btn-data-dir {

  padding: 6px 14px;

  background: rgba(255,255,255,0.75);

  backdrop-filter: blur(4px);

  -webkit-backdrop-filter: blur(4px);

  border: 1px solid var(--border-column);

  border-radius: 8px;

  font-size: 12px;

  font-weight: 500;

  color: var(--text-secondary);

  cursor: pointer;

  font-family: inherit;

  transition: all var(--transition-fast);

  white-space: nowrap;

}

.btn-data-dir:hover {

  background: #fff;

  border-color: #7c8ce0;

  color: var(--color-col-progress);

}

.data-dir-indicator {

  display: inline-flex;

  align-items: center;

  gap: 4px;

  font-size: 11px;

  color: var(--text-muted);

  padding: 4px 10px;

  background: rgba(255,255,255,0.6);

  border: 1px dashed var(--border-column);

  border-radius: 6px;

  max-width: 280px;

  overflow: hidden;

  text-overflow: ellipsis;

  white-space: nowrap;

}

.data-dir-indicator.file-mode {

  color: #2f855a;

  border-color: #5a9e6f;

  background: rgba(230,245,234,0.6);

}

/* ==================== 看板三列布局 ==================== */

.board {

  max-width: 1300px;

  margin: 0 auto;

  padding: 0 24px 40px;

  display: grid;

  grid-template-columns: repeat(3, 1fr);

  gap: 18px;

  align-items: start;

}

.column {

  background: rgba(255,255,255,0.65);

  backdrop-filter: blur(var(--blur-glass));

  -webkit-backdrop-filter: blur(var(--blur-glass));

  border: 1px solid var(--border-column);

  border-radius: var(--radius-column);

  padding: 14px;

  display: flex;

  flex-direction: column;

  transition: box-shadow var(--transition-normal), border-color var(--transition-normal);

}

.column.drag-over {

  box-shadow: 0 0 0 2px rgba(124,140,224,0.35), 0 4px 20px rgba(124,140,224,0.12);

  border-color: #bcc4f0;

}

.column::before {

  content: '';

  display: block;

  height: 3px;

  border-radius: 0 0 3px 3px;

  margin: -14px -14px 12px -14px;

}

.column.col-todo::before { background: var(--color-col-todo); }

.column.col-progress::before { background: var(--color-col-progress); }

.column.col-done::before { background: var(--color-col-done); }

.column-header {

  display: flex;

  align-items: center;

  justify-content: space-between;

  margin-bottom: 8px;

}

.column-header .col-title {

  font-size: 14px;

  font-weight: 600;

  color: var(--text-primary);

  display: flex;

  align-items: center;

  gap: 8px;

}

.column-header .col-count {

  display: inline-flex;

  align-items: center;

  justify-content: center;

  min-width: 22px;

  height: 22px;

  padding: 0 6px;

  background: rgba(0,0,0,0.06);

  border-radius: 11px;

  font-size: 11px;

  font-weight: 600;

  color: var(--text-secondary);

}

.btn-add-task {

  width: 28px;

  height: 28px;

  border-radius: 7px;

  border: 1px solid var(--border-column);

  background: rgba(255,255,255,0.8);

  color: var(--text-secondary);

  font-size: 18px;

  line-height: 1;

  cursor: pointer;

  transition: all var(--transition-fast);

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 0;

}

.btn-add-task:hover {

  background: #fff;

  border-color: #bcc4f0;

  color: var(--color-col-progress);

  box-shadow: var(--shadow-card);

}

.card-list {

  display: flex;

  flex-direction: column;

  gap: 10px;

  flex: 1;

  min-height: 60px;

}

/* ==================== 任务卡片 ==================== */

.task-card {

  background: rgba(255,255,255,0.9);

  backdrop-filter: blur(4px);

  -webkit-backdrop-filter: blur(4px);

  border: 1px solid rgba(0,0,0,0.06);

  border-radius: var(--radius-card);

  padding: 16px 18px;

  cursor: grab;

  position: relative;

  box-shadow: var(--shadow-card);

  transition: box-shadow var(--transition-normal), transform var(--transition-fast),

    border-color var(--transition-normal);

  animation: cardIn 0.25s ease;

}

@keyframes cardIn {

  from { opacity: 0; transform: translateY(8px); }

  to { opacity: 1; transform: translateY(0); }

}

.task-card:hover {

  box-shadow: var(--shadow-card-hover);

  border-color: rgba(0,0,0,0.1);

}

.task-card:active { cursor: grabbing; }

.task-card.dragging {

  opacity: 0.5;

  transform: scale(0.96);

}

.task-card .card-checkbox {

  position: absolute;

  top: 10px;

  left: 10px;

  width: 16px;

  height: 16px;

  cursor: pointer;

  accent-color: #dc2626;

  opacity: 0;

  transition: opacity var(--transition-fast);

  z-index: 1;

}

.task-card:hover .card-checkbox,

.task-card .card-checkbox:checked {

  opacity: 1;

}

.task-card .card-title {

  font-size: 14px;

  font-weight: 600;

  color: var(--text-primary);

  margin-bottom: 6px;

  line-height: 1.4;

  padding-left: 0;

  transition: padding-left var(--transition-fast);

}

.task-card .card-desc {

  font-size: 12px;

  color: var(--text-secondary);

  margin-bottom: 6px;

  line-height: 1.5;

  display: -webkit-box;

  -webkit-line-clamp: 3;

  -webkit-box-orient: vertical;

  overflow: hidden;

}

.task-card .card-progress-preview {

  font-size: 11px;

  color: var(--text-muted);

  margin-top: 8px;

  margin-bottom: 2px;

  line-height: 1.5;

  display: -webkit-box;

  -webkit-line-clamp: 2;

  -webkit-box-orient: vertical;

  overflow: hidden;

  padding-left: 6px;

  border-left: 2px solid var(--color-col-progress);

}

.task-card .card-progress-preview .progress-label {

  font-weight: 500;

  color: #7c8ce0;

  margin-right: 2px;

}

.task-card .card-meta {

  display: flex;

  align-items: center;

  gap: 6px;

  flex-wrap: wrap;

}

.task-card .card-meta .due-date {

  font-size: 11px;

  color: var(--text-muted);

  display: flex;

  align-items: center;

  gap: 3px;

}

.task-card .card-meta .due-date.overdue {

  color: #dc2626;

  font-weight: 500;

}

.priority-tag {

  display: inline-flex;

  align-items: center;

  gap: 3px;

  padding: 2px 8px;

  border-radius: var(--radius-tag);

  font-size: 12px;

  font-weight: 500;

  white-space: nowrap;

}

.priority-tag.high { background: var(--color-high-bg); color: var(--color-high-text); }

.priority-tag.medium { background: var(--color-mid-bg); color: var(--color-mid-text); }

.priority-tag.low { background: var(--color-low-bg); color: var(--color-low-text); }

.category-tags { display: flex; gap: 4px; flex-wrap: wrap; }

.category-tag {

  display: inline-block;

  padding: 1px 7px;

  border-radius: 4px;

  background: var(--color-tag-bg);

  color: var(--color-tag-text);

  font-size: 11px;

  font-weight: 500;

  white-space: nowrap;

}

/* ==================== 右键菜单 ==================== */

.context-menu {

  position: fixed;

  z-index: 1000;

  background: rgba(255,255,255,0.96);

  backdrop-filter: blur(12px);

  -webkit-backdrop-filter: blur(12px);

  border: 1px solid var(--border-column);

  border-radius: 10px;

  padding: 4px 0;

  min-width: 150px;

  box-shadow: 0 4px 24px rgba(0,0,0,0.12), 0 1px 4px rgba(0,0,0,0.06);

  opacity: 0;

  transform: scale(0.92);

  pointer-events: none;

  transition: opacity 0.12s ease, transform 0.12s ease;

}

.context-menu.show {

  opacity: 1;

  transform: scale(1);

  pointer-events: auto;

}

.context-menu .menu-item {

  display: block;

  width: 100%;

  padding: 8px 16px;

  border: none;

  background: transparent;

  font-size: 13px;

  color: var(--text-primary);

  cursor: pointer;

  text-align: left;

  font-family: inherit;

  transition: background var(--transition-fast);

}

.context-menu .menu-item:hover { background: #f3f4f6; }

.context-menu .menu-item.danger { color: #dc2626; }

.context-menu .menu-item.danger:hover { background: #fef2f2; }

.context-menu .menu-divider {

  height: 1px;

  background: var(--border-column);

  margin: 3px 8px;

}

/* ==================== Modal ==================== */

.modal-overlay {

  position: fixed;

  inset: 0;

  z-index: 900;

  background: rgba(0,0,0,0.3);

  backdrop-filter: blur(2px);

  -webkit-backdrop-filter: blur(2px);

  display: flex;

  align-items: center;

  justify-content: center;

  animation: fadeIn 0.2s ease;

}

@keyframes fadeIn {

  from { opacity: 0; }

  to { opacity: 1; }

}

.modal {

  background: #fff;

  border-radius: var(--radius-modal);

  padding: 24px 28px;

  width: 480px;

  max-width: 94vw;

  max-height: 85vh;

  overflow-y: auto;

  box-shadow: 0 8px 40px rgba(0,0,0,0.15);

  animation: modalIn 0.25s ease;

}

@keyframes modalIn {

  from { opacity: 0; transform: translateY(20px) scale(0.96); }

  to { opacity: 1; transform: translateY(0) scale(1); }

}

.modal h2 {

  font-size: 18px;

  font-weight: 700;

  margin-bottom: 18px;

  color: var(--text-primary);

}

.modal .form-group { margin-bottom: 14px; }

.modal .form-group label {

  display: block;

  font-size: 12px;

  font-weight: 600;

  color: var(--text-secondary);

  margin-bottom: 5px;

  text-transform: uppercase;

  letter-spacing: 0.04em;

}

.modal .form-group input,

.modal .form-group textarea,

.modal .form-group select {

  width: 100%;

  padding: 8px 12px;

  border: 1px solid #d1d5db;

  border-radius: 8px;

  font-size: 14px;

  font-family: inherit;

  color: var(--text-primary);

  outline: none;

  transition: border-color var(--transition-fast);

}

.modal .form-group input:focus,

.modal .form-group textarea:focus,

.modal .form-group select:focus {

  border-color: #7c8ce0;

  box-shadow: 0 0 0 3px rgba(124,140,224,0.1);

}

.modal .form-group textarea { resize: vertical; min-height: 80px; }

.tag-input-wrapper {

  display: flex;

  flex-wrap: wrap;

  gap: 6px;

  align-items: center;

  padding: 6px 8px;

  border: 1px solid #d1d5db;

  border-radius: 8px;

  min-height: 38px;

  background: #fff;

  transition: border-color var(--transition-fast);

}

.tag-input-wrapper:focus-within {

  border-color: #7c8ce0;

  box-shadow: 0 0 0 3px rgba(124,140,224,0.1);

}

.tag-input-wrapper .tag-chip {

  display: inline-flex;

  align-items: center;

  gap: 4px;

  padding: 2px 8px;

  background: var(--color-tag-bg);

  color: var(--color-tag-text);

  border-radius: 4px;

  font-size: 12px;

  font-weight: 500;

}

.tag-input-wrapper .tag-chip .tag-remove {

  cursor: pointer;

  font-size: 14px;

  line-height: 1;

  color: #9ca3af;

  transition: color var(--transition-fast);

}

.tag-input-wrapper .tag-chip .tag-remove:hover { color: #dc2626; }

.tag-input-wrapper input.tag-input {

  border: none;

  outline: none;

  flex: 1;

  min-width: 80px;

  font-size: 13px;

  padding: 2px 4px;

  font-family: inherit;

  background: transparent;

  box-shadow: none;

}

.modal .form-actions {

  display: flex;

  gap: 10px;

  justify-content: flex-end;

  margin-top: 20px;

}

.btn-primary {

  padding: 8px 20px;

  background: #4f6ef7;

  color: #fff;

  border: none;

  border-radius: 8px;

  font-size: 14px;

  font-weight: 500;

  cursor: pointer;

  font-family: inherit;

  transition: background var(--transition-fast);

}

.btn-primary:hover { background: #3b54d4; }

.btn-secondary {

  padding: 8px 20px;

  background: #f3f4f6;

  color: var(--text-primary);

  border: 1px solid #d1d5db;

  border-radius: 8px;

  font-size: 14px;

  cursor: pointer;

  font-family: inherit;

  transition: background var(--transition-fast);

}

.btn-secondary:hover { background: #e5e7eb; }

/* ==================== 每日待办按钮 ==================== */

.btn-daily-todo {

  padding: 8px 18px;

  background: linear-gradient(135deg, #fef6e4 0%, #fff9e6 100%);

  border: 1px solid #f5c518;

  border-radius: 10px;

  font-size: 13px;

  font-weight: 600;

  color: #b7791f;

  cursor: pointer;

  font-family: inherit;

  transition: all var(--transition-fast);

  white-space: nowrap;

  box-shadow: 0 1px 3px rgba(245,197,24,0.15);

}

.btn-daily-todo:hover {

  background: linear-gradient(135deg, #f5c518 0%, #fbbf24 100%);

  color: #fff;

  box-shadow: 0 2px 8px rgba(245,197,24,0.3);

  transform: translateY(-1px);

}

/* ==================== 每日待办侧边栏 ==================== */

.daily-overlay {

  position: fixed;

  inset: 0;

  z-index: 800;

  background: rgba(0,0,0,0.35);

  backdrop-filter: blur(2px);

  -webkit-backdrop-filter: blur(2px);

  opacity: 0;

  pointer-events: none;

  transition: opacity 0.3s ease;

}

.daily-overlay.show {

  opacity: 1;

  pointer-events: auto;

}

.daily-sidebar {

  position: fixed;

  top: 0;

  right: -360px;

  width: 360px;

  max-width: 92vw;

  height: 100vh;

  z-index: 810;

  background: #fffdf7;

  box-shadow: -4px 0 24px rgba(0,0,0,0.1), -1px 0 4px rgba(0,0,0,0.04);

  display: flex;

  flex-direction: column;

  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);

  overflow: hidden;

}

.daily-sidebar.open { transform: translateX(-360px); }

.daily-sidebar-header {

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding: 18px 20px 14px;

  border-bottom: 1px solid #f0e8d0;

  flex-shrink: 0;

}

.daily-sidebar-header h2 {

  font-size: 17px;

  font-weight: 700;

  color: var(--text-primary);

  margin: 0;

}

.daily-sidebar-close {

  width: 32px;

  height: 32px;

  border-radius: 8px;

  border: 1px solid #e5e7eb;

  background: #fff;

  color: var(--text-secondary);

  font-size: 16px;

  cursor: pointer;

  display: flex;

  align-items: center;

  justify-content: center;

  transition: all var(--transition-fast);

  font-family: inherit;

}

.daily-sidebar-close:hover { background: #f3f4f6; color: var(--text-primary); }

.daily-date-bar {

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding: 14px 20px;

  border-bottom: 1px solid #f3f4f6;

  flex-shrink: 0;

}

.daily-date-label {

  font-size: 15px;

  font-weight: 700;

  color: var(--text-primary);

  display: flex;

  align-items: center;

  gap: 6px;

}

.daily-date-label small {

  font-weight: 400;

  font-size: 12px;

  color: var(--text-muted);

}

.btn-daily-calendar {

  padding: 5px 12px;

  background: transparent;

  border: 1px solid #e5e7eb;

  border-radius: 7px;

  font-size: 12px;

  color: var(--text-secondary);

  cursor: pointer;

  font-family: inherit;

  transition: all var(--transition-fast);

  white-space: nowrap;

}

.btn-daily-calendar:hover { background: #f9fafb; border-color: #d1d5db; }

/* 侧边栏主体内容区 */

.daily-body {

  flex: 1;

  overflow-y: auto;

  padding: 16px 20px;

}

/* 空状态 */

.daily-empty {

  text-align: center;

  padding: 40px 10px;

  color: var(--text-muted);

  font-size: 13px;

  line-height: 1.8;

}

.daily-empty-icon { font-size: 40px; display: block; margin-bottom: 12px; }

.btn-daily-create {

  display: block;

  width: 100%;

  padding: 10px 16px;

  margin-top: 16px;

  background: #4f6ef7;

  color: #fff;

  border: none;

  border-radius: 10px;

  font-size: 14px;

/* ==================== 滚动条美化 ==================== */

::-webkit-scrollbar { width: 6px; }

::-webkit-scrollbar-track { background: transparent; }

::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }

::-webkit-scrollbar-thumb:hover { background: #9ca3af; }

/* ==================== Toast ==================== */

.toast {

  position: fixed;

  bottom: 30px;

  left: 50%;

  transform: translateX(-50%);

  z-index: 2000;

  background: #1a1a2e;

  color: #fff;

  padding: 10px 22px;

  border-radius: 10px;

  font-size: 13px;

  font-weight: 500;

  pointer-events: none;

  animation: toastIn 0.3s ease, toastOut 0.3s ease 1.7s forwards;

  white-space: nowrap;

}

@keyframes toastIn {

  from { opacity: 0; transform: translateX(-50%) translateY(12px); }

  to { opacity: 1; transform: translateX(-50%) translateY(0); }

}

@keyframes toastOut {

  from { opacity: 1; transform: translateX(-50%) translateY(0); }

  to { opacity: 0; transform: translateX(-50%) translateY(12px); }

}

'use strict';

/* ============================

 * DataStorage — 数据存储抽象层

 * 支持：File System Access API（优先）+ localStorage（回退/备份）

 * ============================ */

class DataStorage {

  constructor() {

    this._mode = 'localStorage'; // 'localStorage' | 'fileSystem'

    this._dirHandle = null;

    this._dirName = '';

    this._localKey = 'task-board-data';

    this._configKey = 'task-board-config';

    this._fsAvailable = (typeof window.showDirectoryPicker === 'function');

  }

  get mode() { return this._mode; }

  get dirName() { return this._dirName; }

  get fsAvailable() { return this._fsAvailable; }

  async init() {

    try {

      const cfgRaw = localStorage.getItem(this._configKey);

      if (!cfgRaw) return;

      const cfg = JSON.parse(cfgRaw);

      if (cfg.mode === 'fileSystem' && cfg.dirName && this._fsAvailable) {

        try {

          this._dirHandle = await window.showDirectoryPicker({ mode: 'readwrite', startIn: 'desktop' });

          if (this._dirHandle.name !== cfg.dirName) {

            this._dirHandle = null;

            this._mode = 'localStorage';

            this._dirName = '';

            this._saveConfig();

            return;

          }

          this._mode = 'fileSystem';

          this._dirName = cfg.dirName;

          console.log(`📁 已恢复文件存储目录: ${this._dirName}`);

        } catch (e) {

          console.warn('恢复文件目录权限失败，使用 localStorage', e);

          this._mode = 'localStorage';

          this._dirHandle = null;

          this._dirName = '';

          this._saveConfig();

        }

      }

    } catch (e) {

      console.warn('DataStorage 初始化失败', e);

    }

  }

  async selectDirectory() {

    if (!this._fsAvailable) {

      throw new Error('当前浏览器不支持 File System Access API（需要 Chrome 86+/Edge 86+）');

    }

    try {

      const handle = await window.showDirectoryPicker({ mode: 'readwrite', startIn: 'desktop' });

      this._dirHandle = handle;

      this._dirName = handle.name;

      this._mode = 'fileSystem';

      this._saveConfig();

      return this._dirName;

    } catch (e) {

      if (e.name === 'AbortError') return null;

      throw e;

    }

  }

  switchToLocal() {

    this._mode = 'localStorage';

    this._dirHandle = null;

    this._dirName = '';

    this._saveConfig();

  }

  _saveConfig() {

    const cfg = { mode: this._mode, dirName: this._dirName };

    localStorage.setItem(this._configKey, JSON.stringify(cfg));

  }

  async loadFromFile() {

    if (!this._dirHandle) throw new Error('未设置文件目录');

    try {

      let fileHandle;

      try {

        fileHandle = await this._dirHandle.getFileHandle('tasks.json');

      } catch {

        return [];

      }

      const file = await fileHandle.getFile();

      const text = await file.text();

      return JSON.parse(text);

    } catch (e) {

      console.warn('从文件读取数据失败', e);

      throw e;

    }

  }

  async saveToFile(data) {

    if (!this._dirHandle) throw new Error('未设置文件目录');

    try {

      const fileHandle = await this._dirHandle.getFileHandle('tasks.json', { create: true });

      const writable = await fileHandle.createWritable();

      await writable.write(JSON.stringify(data, null, 2));

      await writable.close();

      return true;

    } catch (e) {

      console.error('写入文件失败', e);

      throw e;

    }

  }

  loadFromLocal() {

    try {

      const raw = localStorage.getItem(this._localKey);

      return raw ? JSON.parse(raw) : [];

    } catch (e) {

      console.warn('localStorage 读取失败', e);

      return [];

    }

  }

  saveToLocal(data) {

    try {

      localStorage.setItem(this._localKey, JSON.stringify(data));

    } catch (e) {

      console.error('localStorage 写入失败', e);

    }

  }

}

/* ============================

 * TaskManager — 数据管理层

 * ============================ */

class TaskManager {

  constructor(dataStorage) {

    this._ds = dataStorage;

    this.tasks = [];

  }

  async init() {

    await this._ds.init();

    if (this._ds.mode === 'fileSystem' && this._ds.fsAvailable) {

      try {

        this.tasks = await this._ds.loadFromFile();

        console.log(`📁 已从文件加载 ${this.tasks.length} 个任务`);

      } catch (e) {

        console.warn('文件加载失败，回退到 localStorage', e);

        this.tasks = this._ds.loadFromLocal();

      }

    } else {

      this.tasks = this._ds.loadFromLocal();

      console.log(`💾 已从 localStorage 加载 ${this.tasks.length} 个任务`);

    }

    this.tasks = this.tasks.map(t => ({

      id: t.id || crypto.randomUUID(),

      title: t.title || '',

      description: t.description || '',

      dueDate: t.dueDate || '',

      priority: t.priority || 'medium',

      tags: Array.isArray(t.tags) ? t.tags : [],

      status: t.status || 'todo',

      createdAt: t.createdAt || Date.now(),

      progress: Array.isArray(t.progress) ? t.progress : []

    }));

    await this._persist();

  }

  async _persist() {

    if (this._ds.mode === 'fileSystem' && this._ds.fsAvailable) {

      try {

        await this._ds.saveToFile(this.tasks);

      } catch (e) {

        console.warn('文件写入失败，使用 localStorage 备份', e);

        this._ds.saveToLocal(this.tasks);

      }

    }

    this._ds.saveToLocal(this.tasks);

  }

  async setFileDirectory() {

    const dirName = await this._ds.selectDirectory();

    if (!dirName) return null;

    await this._persist();

    return dirName;

  }

  async switchToLocalStorage() {

    this._ds.switchToLocal();

    await this._persist();

  }

  get storageMode() { return this._ds.mode; }

  get storageDirName() { return this._ds.dirName; }

  getAll() { return this.tasks; }

  getById(id) { return this.tasks.find(t => t.id === id) || null; }

  async add(taskData) {

    const task = {

      id: crypto.randomUUID(),

      title: taskData.title || '未命名任务',

      description: taskData.description || '',

      dueDate: taskData.dueDate || '',

      priority: taskData.priority || 'medium',

      tags: Array.isArray(taskData.tags) ? [...taskData.tags] : [],

      status: taskData.status || 'todo',

      createdAt: Date.now(),

      progress: []

    };

    this.tasks.push(task);

    await this._persist();

    return task;

  }

  async update(id, updates) {

    const idx = this.tasks.findIndex(t => t.id === id);

    if (idx === -1) return null;

    this.tasks[idx] = { ...this.tasks[idx], ...updates };

    await this._persist();

    return this.tasks[idx];

  }

  async delete(id) {

    const idx = this.tasks.findIndex(t => t.id === id);

    if (idx === -1) return false;

    this.tasks.splice(idx, 1);

    await this._persist();

    return true;

  }

  async deleteMany(ids) {

    const idSet = new Set(ids);

    this.tasks = this.tasks.filter(t => !idSet.has(t.id));

    await this._persist();

  }

  async copy(id) {

    const original = this.getById(id);

    if (!original) return null;

    const copy = {

      ...original,

      id: crypto.randomUUID(),

      title: original.title + ' (副本)',

      createdAt: Date.now(),

      progress: original.progress ? original.progress.map(p => ({...p})) : []

    };

    this.tasks.push(copy);

    await this._persist();

    return copy;

  }

  async addProgress(taskId, text) {

    const task = this.getById(taskId);

    if (!task) return null;

    if (!Array.isArray(task.progress)) task.progress = [];

    const record = { text: text.trim(), time: Date.now() };

    task.progress.push(record);

    await this._persist();

    return record;

  }

  async deleteProgress(taskId, index) {

    const task = this.getById(taskId);

    if (!task || !Array.isArray(task.progress)) return false;

    if (index < 0 || index >= task.progress.length) return false;

    task.progress.splice(index, 1);

    await this._persist();

    return true;

  }

  async updateProgress(taskId, index, newText) {

    const task = this.getById(taskId);

    if (!task || !Array.isArray(task.progress)) return false;

    if (index < 0 || index >= task.progress.length) return false;

    task.progress[index].text = newText.trim();

    await this._persist();

    return true;

  }

  getFilteredAndSorted(filters, sortBy) {

    let result = [...this.tasks];

    if (filters.priority && filters.priority !== 'all') {

      result = result.filter(t => t.priority === filters.priority);

    }

    if (filters.tag && filters.tag !== 'all') {

      result = result.filter(t => t.tags && t.tags.includes(filters.tag));

    }

    if (filters.date && filters.date !== 'all') {

      const now = new Date();

      const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());

      const todayEnd = new Date(todayStart.getTime() + 86400000);

      if (filters.date === 'today') {

        result = result.filter(t => t.dueDate && new Date(t.dueDate + 'T00:00:00') >= todayStart && new Date(t.dueDate + 'T00:00:00') < todayEnd);

      } else if (filters.date === 'week') {

        const dayOfWeek = now.getDay() || 7;

        const weekStart = new Date(todayStart);

        weekStart.setDate(weekStart.getDate() - dayOfWeek + 1);

        const weekEnd = new Date(weekStart);

        weekEnd.setDate(weekEnd.getDate() + 7);

        result = result.filter(t => t.dueDate && new Date(t.dueDate + 'T00:00:00') >= weekStart && new Date(t.dueDate + 'T00:00:00') < weekEnd);

      } else if (filters.date === 'month') {

        const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);

        const monthEnd = new Date(now.getFullYear(), now.getMonth() + 1, 1);

        result = result.filter(t => t.dueDate && new Date(t.dueDate + 'T00:00:00') >= monthStart && new Date(t.dueDate + 'T00:00:00') < monthEnd);

      }

    }

    if (sortBy === 'dueDate') {

      result.sort((a, b) => {

        if (!a.dueDate && !b.dueDate) return 0;

        if (!a.dueDate) return 1;

        if (!b.dueDate) return -1;

        return new Date(a.dueDate) - new Date(b.dueDate);

      });

    } else if (sortBy === 'priority') {

      const order = { high: 0, medium: 1, low: 2 };

      result.sort((a, b) => (order[a.priority] ?? 1) - (order[b.priority] ?? 1));

    } else {

      result.sort((a, b) => b.createdAt - a.createdAt);

    }

    return result;

  }

  getAllTags() {

    const tagSet = new Set();

    this.tasks.forEach(t => { if (Array.isArray(t.tags)) t.tags.forEach(tag => tagSet.add(tag)); });

    return [...tagSet].sort();

  }

  getStats() {

    const total = this.tasks.length;

    const done = this.tasks.filter(t => t.status === 'done').length;

    return { total, done, undone: total - done };

  }

}

/* ============================

 * UIManager — UI 渲染与交互层

 * ============================ */

class UIManager {

  constructor(taskManager) {

    this.tm = taskManager;

    this.draggingTaskId = null;

    this.selectedCardIds = new Set();

    this.contextMenuTargetId = null;

    this.cacheDom();

    this.bindEvents();

    this.refreshAll();

    this.updateDataDirIndicator();

  }

  cacheDom() {

    this.$board = document.getElementById('board');

    this.$batchBar = document.getElementById('batchBar');

    this.$batchCount = document.getElementById('batchCount');

    this.$contextMenu = document.getElementById('contextMenu');

    this.$modalContainer = document.getElementById('modalContainer');

    this.$toastContainer = document.getElementById('toastContainer');

    this.$statTotal = document.getElementById('statTotal');

    this.$statDone = document.getElementById('statDone');

    this.$statUndone = document.getElementById('statUndone');

    this.$filterPriority = document.getElementById('filterPriority');

    this.$filterTag = document.getElementById('filterTag');

    this.$filterDate = document.getElementById('filterDate');

    this.$sortBy = document.getElementById('sortBy');

    this.$btnBatchDelete = document.getElementById('btnBatchDelete');

    this.$btnBatchCancel = document.getElementById('btnBatchCancel');

    this.$btnDataDir = document.getElementById('btnDataDir');

    this.$dataDirIndicator = document.getElementById('dataDirIndicator');

    this.columnMap = {

      'todo': { list: document.getElementById('listTodo'), count: document.getElementById('countTodo') },

      'in-progress': { list: document.getElementById('listInProgress'), count: document.getElementById('countInProgress') },

      'done': { list: document.getElementById('listDone'), count: document.getElementById('countDone') }

    };

  }

  bindEvents() {

    // 拖拽防误触：追踪鼠标是否发生了实际移动

    this._mouseDownPos = null;

    this._mouseMoved = false;

    document.querySelectorAll('.btn-add-task').forEach(btn => {

      btn.addEventListener('click', (e) => {

        const status = e.currentTarget.dataset.status;

        this.openModal(null, status);

      });

    });

    // 单击触发编辑（替代原来的 dblclick），同时防止拖拽误触

    this.$board.addEventListener('mousedown', (e) => {

      const card = e.target.closest('.task-card');

      if (card && e.button === 0) {

        this._mouseDownPos = { x: e.clientX, y: e.clientY };

        this._mouseMoved = false;

      }

    });

    this.$board.addEventListener('mousemove', (e) => {

      if (this._mouseDownPos) {

        const dx = Math.abs(e.clientX - this._mouseDownPos.x);

        const dy = Math.abs(e.clientY - this._mouseDownPos.y);

        if (dx > 5 || dy > 5) this._mouseMoved = true;

      }

    });

    this.$board.addEventListener('click', (e) => {

      const card = e.target.closest('.task-card');

      if (!card) return;

      // 如果是 checkbox 点击，不触发编辑

      if (e.target.classList.contains('card-checkbox')) return;

      // 如果发生了拖拽移动，不触发编辑

      if (this._mouseMoved) return;

      this.openModal(card.dataset.taskId);

    });

    document.addEventListener('mouseup', () => {

      this._mouseDownPos = null;

    });

    this.$board.addEventListener('dragstart', (e) => {

      const card = e.target.closest('.task-card');

      if (!card) return;

      this.draggingTaskId = card.dataset.taskId;

      card.classList.add('dragging');

      e.dataTransfer.effectAllowed = 'move';

      e.dataTransfer.setData('text/plain', card.dataset.taskId);

    });

    this.$board.addEventListener('dragend', (e) => {

      const card = e.target.closest('.task-card');

      if (card) card.classList.remove('dragging');

      this.draggingTaskId = null;

      this._mouseMoved = false;

      document.querySelectorAll('.column').forEach(col => col.classList.remove('drag-over'));

    });

    document.querySelectorAll('.column').forEach(column => {

      column.addEventListener('dragover', (e) => {

        e.preventDefault();

        e.dataTransfer.dropEffect = 'move';

        column.classList.add('drag-over');

      });

      column.addEventListener('dragleave', (e) => {

        if (!column.contains(e.relatedTarget)) column.classList.remove('drag-over');

      });

      column.addEventListener('drop', (e) => {

        e.preventDefault();

        column.classList.remove('drag-over');

        const taskId = e.dataTransfer.getData('text/plain');

        const newStatus = column.dataset.status;

        if (taskId && newStatus) this.moveTask(taskId, newStatus);

      });

    });

    this.$board.addEventListener('contextmenu', (e) => {

      const card = e.target.closest('.task-card');

      if (card) {

        e.preventDefault();

        this.contextMenuTargetId = card.dataset.taskId;

        this.showContextMenu(e.clientX, e.clientY);

      }

    });

    document.addEventListener('click', (e) => {

      if (!this.$contextMenu.contains(e.target)) this.hideContextMenu();

    });

    this.$contextMenu.addEventListener('click', (e) => {

      const menuItem = e.target.closest('.menu-item');

      if (!menuItem) return;

      this.handleContextAction(menuItem.dataset.action, this.contextMenuTargetId);

      this.hideContextMenu();

    });

    this.$board.addEventListener('change', (e) => {

      if (e.target.classList.contains('card-checkbox')) {

        const taskId = e.target.dataset.taskId;

        if (e.target.checked) this.selectedCardIds.add(taskId);

        else this.selectedCardIds.delete(taskId);

        this.updateBatchBar();

      }

    });

    this.$btnBatchDelete.addEventListener('click', () => {

      if (this.selectedCardIds.size === 0) return;

      if (confirm(`确定要删除选中的 ${this.selectedCardIds.size} 个任务吗？此操作不可撤销。`)) {

        this.tm.deleteMany([...this.selectedCardIds]);

        this.selectedCardIds.clear();

        this.updateBatchBar();

        this.refreshAll();

        this.showToast('已删除选中任务');

      }

    });

    this.$btnBatchCancel.addEventListener('click', () => {

      this.selectedCardIds.clear();

      this.updateBatchBar();

      this.refreshAll();

    });

    [this.$filterPriority, this.$filterTag, this.$filterDate, this.$sortBy].forEach(el => {

      el.addEventListener('change', () => this.refreshBoard());

    });

    // 数据目录按钮

    this.$btnDataDir.addEventListener('click', () => this.handleDataDir());

  }

  refreshAll() {

    this.refreshBoard();

    this.refreshStats();

    this.refreshTagFilter();

  }

  refreshBoard() {

    const filters = {

      priority: this.$filterPriority.value,

      tag: this.$filterTag.value,

      date: this.$filterDate.value

    };

    const sortBy = this.$sortBy.value;

    const filteredTasks = this.tm.getFilteredAndSorted(filters, sortBy);

    const grouped = { 'todo': [], 'in-progress': [], 'done': [] };

    filteredTasks.forEach(t => {

      if (grouped[t.status]) grouped[t.status].push(t);

      else grouped['todo'].push(t);

    });

    Object.entries(grouped).forEach(([status, tasks]) => {

      const col = this.columnMap[status];

      if (!col) return;

      col.list.innerHTML = '';

      col.count.textContent = tasks.length;

      tasks.forEach(task => col.list.appendChild(this.createCardElement(task)));

    });

    this.restoreCheckboxStates();

  }

  refreshStats() {

    const stats = this.tm.getStats();

    this.$statTotal.textContent = stats.total;

    this.$statDone.textContent = stats.done;

    this.$statUndone.textContent = stats.undone;

  }

  refreshTagFilter() {

    const tags = this.tm.getAllTags();

    const currentValue = this.$filterTag.value;

    this.$filterTag.innerHTML = '<option value="all">全部</option>';

    tags.forEach(tag => {

      const opt = document.createElement('option');

      opt.value = tag;

      opt.textContent = tag;

      this.$filterTag.appendChild(opt);

    });

    if (tags.includes(currentValue)) this.$filterTag.value = currentValue;

  }

  createCardElement(task) {

    const card = document.createElement('div');

    card.className = 'task-card';

    card.dataset.taskId = task.id;

    card.draggable = true;

    const priorityLabels = { high: '🔴 高', medium: '🟡 中', low: '🟢 低' };

    let dueDateHtml = '';

    if (task.dueDate) {

      const dueDate = new Date(task.dueDate + 'T00:00:00');

      const today = new Date(); today.setHours(0,0,0,0);

      const isOverdue = dueDate < today && task.status !== 'done';

      dueDateHtml = `<span class="due-date ${isOverdue ? 'overdue' : ''}">📅 ${task.dueDate}${isOverdue ? ' (已逾期)' : ''}</span>`;

    }

    let tagsHtml = '';

    if (task.tags && task.tags.length > 0) {

      tagsHtml = '<span class="category-tags">' + task.tags.map(t => `<span class="category-tag">${this.escapeHtml(t)}</span>`).join('') + '</span>';

    }

    let descHtml = '';

    if (task.description) descHtml = `<div class="card-desc">${this.escapeHtml(task.description)}</div>`;

    let progressPreviewHtml = '';

    if (task.progress && task.progress.length > 0) {

      const latestProgress = task.progress[task.progress.length - 1];

      const previewText = latestProgress.text.length > 30 ? latestProgress.text.slice(0, 30) + '…' : latestProgress.text;

      progressPreviewHtml = `<div class="card-progress-preview"><span class="progress-label">💬</span>${this.escapeHtml(previewText)}</div>`;

    }

    card.innerHTML = `

      <input type="checkbox" class="card-checkbox" data-task-id="${task.id}">

      <div class="card-title">${this.escapeHtml(task.title)}</div>

      ${descHtml}

      ${progressPreviewHtml}

      <div class="card-meta">

        <span class="priority-tag ${task.priority}">${priorityLabels[task.priority]}</span>

        ${tagsHtml}

        ${dueDateHtml}

      </div>

    `;

    return card;

  }

  escapeHtml(str) {

    const div = document.createElement('div');

    div.textContent = str;

    return div.innerHTML;

  }

  restoreCheckboxStates() {

    this.selectedCardIds.forEach(taskId => {

      const cb = document.querySelector(`.card-checkbox[data-task-id="${taskId}"]`);

      if (cb) cb.checked = true;

    });

    this.updateBatchBar();

  }

  updateBatchBar() {

    if (this.selectedCardIds.size > 0) {

      this.$batchBar.classList.add('visible');

      this.$batchCount.textContent = `已选择 ${this.selectedCardIds.size} 项`;

    } else {

      this.$batchBar.classList.remove('visible');

    }

  }

  moveTask(taskId, newStatus) {

    const task = this.tm.getById(taskId);

    if (!task || task.status === newStatus) return;

    this.tm.update(taskId, { status: newStatus });

    this.refreshAll();

    const statusLabels = { 'todo': '待处理', 'in-progress': '进行中', 'done': '已完成' };

    this.showToast(`已移至「${statusLabels[newStatus]}」`);

  }

  showContextMenu(x, y) {

    this.$contextMenu.classList.add('show');

    let left = x, top = y;

    if (left + 160 > window.innerWidth) left = window.innerWidth - 170;

    if (top + 220 > window.innerHeight) top = window.innerHeight - 230;

    this.$contextMenu.style.left = left + 'px';

    this.$contextMenu.style.top = top + 'px';

  }

  hideContextMenu() {

    this.$contextMenu.classList.remove('show');

    this.contextMenuTargetId = null;

  }

  handleContextAction(action, taskId) {

    if (!taskId) return;

    const task = this.tm.getById(taskId);

    if (!task) return;

    switch (action) {

      case 'edit': this.openModal(taskId); break;

      case 'copy': {

        const copy = this.tm.copy(taskId);

        if (copy) { this.refreshAll(); this.showToast('已复制任务'); }

        break;

      }

      case 'move-todo': this.moveTask(taskId, 'todo'); break;

      case 'move-progress': this.moveTask(taskId, 'in-progress'); break;

      case 'move-done': this.moveTask(taskId, 'done'); break;

      case 'delete': {

        if (confirm('确定要删除这个任务吗？')) {

          this.tm.delete(taskId);

          this.selectedCardIds.delete(taskId);

          this.updateBatchBar();

          this.refreshAll();

          this.showToast('已删除任务');

        }

        break;

      }

    }

  }

  /* ---------- 数据目录管理 ---------- */

  updateDataDirIndicator() {

    const mode = this.tm.storageMode;

    if (mode === 'fileSystem') {

      this.$dataDirIndicator.textContent = `📁 ${this.tm.storageDirName}/tasks.json`;

      this.$dataDirIndicator.className = 'data-dir-indicator file-mode';

      this.$btnDataDir.textContent = '🔄 切换回 localStorage';

    } else {

      this.$dataDirIndicator.textContent = '💾 localStorage';

      this.$dataDirIndicator.className = 'data-dir-indicator';

      this.$btnDataDir.textContent = '📁 设置数据目录';

    }

  }

  async handleDataDir() {

    if (this.tm.storageMode === 'fileSystem') {

      if (!confirm('切换回 localStorage 模式后，数据将不再自动保存到文件。\n\n（已保存的 tasks.json 文件不会被删除）')) return;

      await this.tm.switchToLocalStorage();

      this.refreshAll();

      this.updateDataDirIndicator();

      this.showToast('已切换回 localStorage 模式');

    } else {

      try {

        const dirName = await this.tm.setFileDirectory();

        if (dirName) {

          this.refreshAll();

          this.updateDataDirIndicator();

          this.showToast(`数据目录已设置为「${dirName}」`);

        }

      } catch (e) {

        console.error(e);

        this.showToast('⚠️ 设置失败: ' + e.message);

      }

    }

  }

  /* ---------- Modal ---------- */

  openModal(taskIdOrNull, presetStatus) {

              <option value="in-progress" ${initialStatus === 'in-progress' ? 'selected' : ''}>🔄 进行中</option>

              <option value="done" ${initialStatus === 'done' ? 'selected' : ''}>✅ 已完成</option>

            </select>

          </div>

          <div class="form-group"><label>标签</label>

            <div class="tag-input-wrapper" id="tagWrapper">

              <input type="text" class="tag-input" id="inputTag" placeholder="输入标签后回车">

            </div>

          </div>

          ${isEdit ? `

          <div class="progress-section" id="progressSection">

            <button class="progress-section-toggle" id="progressToggle" type="button">

              <span>💬 进展记录 <span id="progressBadge" style="font-size:11px;color:var(--text-muted);font-weight:400;"></span></span>

              <span class="toggle-icon">▼</span>

            </button>

            <div class="progress-section-body" id="progressBody">

              <div class="progress-history" id="progressHistory"></div>

              <div class="progress-add-bar">

                <textarea id="progressInput" placeholder="输入进展内容…" rows="2"></textarea>

                <button class="btn-progress-add" id="btnProgressAdd" type="button">添加</button>

              </div>

            </div>

          </div>

          ` : ''}

          <div class="form-actions">

            <button class="btn-secondary" id="btnModalCancel">取消</button>

            <button class="btn-primary" id="btnModalSave">${isEdit ? '保存修改' : '创建任务'}</button>

          </div>

        </div>

      </div>

    `;

    this.$modalContainer.innerHTML = modalHtml;

    const $overlay = document.getElementById('modalOverlay');

    const $inputTitle = document.getElementById('inputTitle');

    const $inputDesc = document.getElementById('inputDesc');

    const $inputDueDate = document.getElementById('inputDueDate');

    const $inputPriority = document.getElementById('inputPriority');

    const $inputStatus = document.getElementById('inputStatus');

    const $tagWrapper = document.getElementById('tagWrapper');

    const $inputTag = document.getElementById('inputTag');

    let currentTags = [...initialTags];

    const renderTags = () => {

      $tagWrapper.querySelectorAll('.tag-chip').forEach(c => c.remove());

      currentTags.forEach(tag => {

        const chip = document.createElement('span');

        chip.className = 'tag-chip';

        chip.innerHTML = `<span>${this.escapeHtml(tag)}</span><span class="tag-remove" data-tag="${this.escapeHtml(tag)}">&times;</span>`;

        chip.querySelector('.tag-remove').addEventListener('click', () => {

          currentTags = currentTags.filter(t => t !== tag);

          renderTags();

        });

        $tagWrapper.insertBefore(chip, $inputTag);

      });

    };

    const addTag = (tagName) => {

      const trimmed = tagName.trim();

      if (!trimmed || currentTags.includes(trimmed)) { $inputTag.value = ''; return; }

      currentTags.push(trimmed);
